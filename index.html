function callClaudeAPI(prompt, callback){
  // 使用后端代理，避免跨域和代理问题
  var apiKey = AI_CONFIG.apiKey;

  if(!apiKey){
    console.log('[AI分析] 未配置API Key，使用本地规则分析');
    console.log('[AI分析] 请检查 ai-config.json 配置');
    callback(null);
    return;
  }

  // 获取当前服务器地址（用于调用后端代理）
  var currentHost = window.location.hostname;
  var proxyUrl = 'http://' + currentHost + ':8787/v1/proxy';  // 代理服务器端口

  console.log('[AI分析] 使用后端代理:', proxyUrl);

  try {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', proxyUrl, true);
    xhr.setRequestHeader('Content-Type', 'application/json');

    xhr.timeout = 30000;
    xhr.onreadystatechange = function(){
      if(xhr.readyState === 4){
        if(xhr.status === 200){
          try {
            var resp = JSON.parse(xhr.responseText);
            // 支持两种格式：Anthropic (content[0].text) 和 OpenAI (choices[0].message.content)
            var content = null;
            if(resp.content && resp.content[0] && resp.content[0].text){
              content = resp.content[0].text;  // Anthropic格式
            } else if(resp.choices && resp.choices[0] && resp.choices[0].message && resp.choices[0].message.content){
              content = resp.choices[0].message.content;  // OpenAI格式
            }
            if(content){
              console.log('[AI分析] API调用成功');
            } else {
              console.warn('[AI分析] API返回空内容', resp);
            }
            callback(content || null);
          } catch(e) {
            console.error('API响应解析失败:', e);
            callback(null);
          }
        } else {
          console.error('API调用失败:', xhr.status, xhr.statusText);
          console.error('响应内容:', xhr.responseText);
          callback(null);
        }
      }
    };
    xhr.onerror = function(){ console.error('API网络错误'); callback(null); };
    xhr.ontimeout = function(){ console.error('API超时'); callback(null); };

    var requestBody = {
      prompt: prompt,
      model: AI_CONFIG.model,
      max_tokens: AI_CONFIG.maxTokens
    };
    xhr.send(JSON.stringify(requestBody));
  } catch(e) {
    console.error('API调用异常:', e);
    callback(null);
  }
}

// 统一的本地分析回退函数
function generateLocalInsight(opts, data){
  var h = '';
  var kpi = calcKPI(data);
  var useRate = calcUseRate(data, {});
  var convertRate = calcConvertRate(data, {});
  var avgPv = data.length > 0 ? Math.round(kpi.pv / data.length) : 0;

  if(opts.type === 'overview'){
    var topCourse = aggBy(data,'course').slice(0,5);
    var topModule = aggBy(data,'module').slice(0,5);
    var stageDist = aggBy(data,'stage');

    h += '<p><strong>📊 整体表现：</strong>当前' + data.length + '个资源总PV ' + kpi.pv.toLocaleString() + '，使用率 ' + useRate + '%，付费转化 ' + convertRate + '%。';
    if(useRate > 40) h += '整体<strong>使用率良好</strong>。';
    else if(useRate > 25) h += '整体使用率<strong>中等</strong>，有优化空间。';
    else h += '整体使用率<strong>偏低</strong>，建议优化资源质量和推广策略。';
    h += '</p>';

    if(topCourse.length >= 2){
      var top1 = topCourse[0], top2 = topCourse[1];
      var gapPct = top2.pv > 0 ? Math.round((top1.pv - top2.pv) / top2.pv * 100) : 0;
      h += '<p><strong>📐 学科差异：</strong>' + top1.name + 'PV最高（' + top1.pv.toLocaleString() + '），领先' + top2.name + ' ' + gapPct + '%。';
      h += gapPct > 50 ? '学科间流量分布<strong>不均衡</strong>。' : '学科间流量分布<strong>相对均衡</strong>。';
      h += '</p>';
    }
    if(stageDist.length >= 2){
      var maxStage = stageDist.reduce(function(a,b){return a.pv>b.pv?a:b;});
      var minStage = stageDist.reduce(function(a,b){return a.pv<b.pv?a:b;});
      h += '<p><strong>🏫 学段特征：</strong>' + maxStage.name + '学段PV最高，' + minStage.name + '最低。建议关注' + minStage.name + '学段的内容供给。</p>';
    }
    if(topModule.length >= 2){
      h += '<p><strong>📦 资源分类洞察：</strong>' + topModule[0].name + '是最热门资源分类（PV ' + topModule[0].pv.toLocaleString() + '）。';
      h += topModule[0].name.indexOf('试卷')>=0 ? '试卷类需求<strong>旺盛</strong>，建议加大建设。' : '该资源分类表现突出，建议复制成功因素。';
      h += '</p>';
    }
  }

  if(opts.type === 'dimension'){
    var dimData = aggBy(data, opts.dimTab === 'module' ? 'module' : opts.dimTab).slice(0,10);
    if(dimData.length >= 2){
      var top1 = dimData[0], top2 = dimData[1];
      var gapPct = top2.pv > 0 ? Math.round((top1.pv - top2.pv) / top2.pv * 100) : 0;
      h += '<p><strong>📊 ' + opts.dimName + '整体表现：</strong>' + top1.name + 'PV最高（' + top1.pv.toLocaleString() + '），领先' + top2.name + ' ' + gapPct + '%。';
      h += gapPct > 100 ? opts.dimName + '间流量<strong>高度集中</strong>。' : (gapPct > 50 ? opts.dimName + '间流量<strong>不均衡</strong>。' : opts.dimName + '间流量<strong>相对均衡</strong>。');
      h += '</p>';
    }
  }

  if(opts.type === 'detail'){
    var topRes = data.slice().sort(function(a,b){return b.pv-a.pv;}).slice(0,20);
    h += '<p><strong>📋 资源整体表现：</strong>共' + data.length + '个资源，均PV ' + avgPv + '，整体使用率 ' + useRate + '%。';
    if(topRes[0]){
      h += '头部资源「' + (topRes[0].title || '未命名').substring(0,20) + '」PV ' + topRes[0].pv.toLocaleString() + '，是均值的' + Math.round(topRes[0].pv / avgPv) + '倍。';
    }
    h += '</p>';
    var lowRes = data.filter(function(r){return r.pv < avgPv / 2;});
    if(lowRes.length > 0){
      h += '<p><strong>⚠️ 长尾资源关注：</strong>' + Math.round(lowRes.length / data.length * 100) + '%的资源PV低于均值一半。建议进行<strong>标题优化</strong>或<strong>内容重组</strong>。</p>';
    }
  }

  return h;
}

  html += '<div class="metric-title">📅 统计周期与资源范围</div>';
  html += '<ul>';
  html += '<li><strong>统计周期</strong>：' + esc(periodText) + '。切换左侧「数据阶段」可查看其它阶段。</li>';
  html += '<li><strong>资源范围</strong>：当前筛选条件下去重后的资源条数。核心资源包括「选品资料」「典例精讲视频」「在线题组」三类；板块归属按资源清单划分。</li>';
  html += '<li><strong>访问口径</strong>：资源详情页访问 + 典例精讲视频播放页访问 + 在线题组访问三类事件合并计算。</li>';
  html += '<li><strong>使用口径</strong>：选品资料下载/全屏预览、选品视频播放（新旧表）、典例精讲视频、在线题组访问六类事件合并计算。</li>';
  html += '</ul>';

  html += '<div class="metric-title">📊 三大板块说明</div>';
  html += '<ul>';
  html += '<li><strong>轻松学</strong>：知识讲解、视频、学案、课件、记背清单等"学"类资源（对应聚合键"学"）。</li>';
  html += '<li><strong>精准练</strong>：课时练习、在线练、自适应练、专项练习等"练"类资源（对应聚合键"练"）。</li>';
  html += '<li><strong>模拟卷</strong>：单元试卷、模拟卷、测试卷、压轴突破等"测"类资源（对应聚合键"测"）。</li>';
  html += '</ul>';

  html += '<div class="metric-title">🗂 资源类型对照</div>';
  html += '<ul>';
  html += '<li><strong>talos</strong>：典例精讲视频。</li>';
  html += '<li><strong>H5</strong>：选品资源中类型为"动画"的内容（交互课件）。</li>';
  html += '<li><strong>SRM题</strong>：在线题组。</li>';
  html += '<li><strong>PDF</strong>：选品资源中除"视频""动画"之外的类型。</li>';
  html += '<li><strong>视频</strong>：选品资源中类型为"视频"的内容。</li>';
  html += '</ul>';

  html += '<div class="metric-title">📈 指标说明</div>';
  html += '<ul>';
  html += '<li><strong>PV</strong>：统计周期内，选品资料访问 + 典例精讲视频访问 + 在线题组访问三类事件的次数之和。</li>';
  html += '<li><strong>UV</strong>：三类访问事件合并后，按 user_id 去重后的访问人数。</li>';
  html += '<li><strong>使用用户数</strong>：选品资料下载、选品资料全屏预览、选品视频播放（旧表/新表）、典例精讲视频、在线题组访问六类事件合并后按 user_id 去重的人数。</li>';
  html += '<li><strong>使用率</strong>：使用用户数 ÷ UV × 100%，反映访问用户中产生使用行为的比例。</li>';
  html += '<li><strong>付费转化用户</strong>：统计周期内“当天使用且当天付费”的用户，付费来源为 app_xkwczx、paid_status=1、refunded=0 且排除内部账号。</li>';
  html += '<li><strong>付费转化率</strong>：付费转化用户 ÷ UV × 100%。</li>';
  html += '<li><strong>下载</strong>：选品资料下载次数 + 在线题组下载（download_type=7）次数之和。</li>';
  html += '<li><strong>资源量</strong>：当前筛选条件下去重后的资源条数。</li>';
  html += '</ul>';

  html += '<div class="metric-title">✅ 什么算「使用」（分资源类型）</div>';
  html += '<ul>';
  html += '<li><strong>选品（总体）</strong>：统计"下载、全预览、视频播放"三类行为。</li>';
  html += '<li><strong>典例精讲</strong>：统计"视频播放"行为。</li>';
  html += '<li><strong>在线题组</strong>：进入在线练即算使用。</li>';
  html += '<li><strong>PDF</strong>：下载用户 + 全预览用户，去重合并。</li>';
  html += '<li><strong>H5</strong>：目前无法统计在线使用行为，使用用户仅按"下载"行为统计（H5 的访问数据 = 进入资料详情页的数据）。</li>';
  html += '</ul>';

  html += '<div class="metric-title">⚠️ 去重与“-- / 数据不足”说明</div>';
  html += '<ul>';
  html += '<li>UV、使用用户数、使用率、付费转化率均为<strong>去重指标</strong>，必须按 user_id 去重聚合，不能由明细直接累加。</li>';
  html += '<li>当看板需要展示「板块 × 场景」「学段 × 学科」等交叉维度，而数仓只提供了单维度聚合时，对应单元格会显示"--"或"数据不足"。</li>';
  html += '<li>次数类指标（PV、下载、资源量）可直接累加，通常不会显示"--"。</li>';
  html += '</ul>';

  html += '<div class="metric-title">💡 看数提示</div>';
  html += '<ul>';
  html += '<li>左侧筛选面板可多维度联动：阶段、学段、学科、年级、版本、资源分类、模块、场景。</li>';
  html += '<li>去重指标（UV/使用用户/使用率/付费转化率）不建议在未选基期的情况下跨阶段直接相加；如需对比多个阶段，请使用「场景对比」板块并选择基期。</li>';
  html += '<li>红色"⚠️ 点击了解"表示该板块在当前场景下无资源数据，属于正常空态。</li>';
  html += '</ul>';

  html += '<p style="margin-top:10px;padding-top:8px;border-top:1px solid var(--b);color:var(--t3);font-size:11px">⚠️ UV、使用用户数、使用率、付费转化率均为去重指标，需按用户 ID 去重聚合，不能由明细直接累加。</p>';
  return html;
}

function toggleDataDetailPanel(){
  var panel = document.getElementById('data-detail-panel');
  if(!panel) return;
  if(panel.style.display === 'none' || panel.style.display === ''){
    var body = document.getElementById('data-detail-body');
    if(body) body.innerHTML = buildMetricDefinitionsHTML();
    panel.style.display = 'flex';
  } else {
    panel.style.display = 'none';
  }
}

function hideDataDetailPanel(){
  var panel = document.getElementById('data-detail-panel');
  if(panel) panel.style.display = 'none';
}

</script>
