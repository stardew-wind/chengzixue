  if (uv === undefined || uv === null || isNaN(uv) || uv === 0) return null;
  return uv;
}

function buildCategorySceneMatrix(data){
  var categories = ['学', '练', '测'];
  // 列 = 动态二级场景：从当前 data 提取真实存在的 scene2（不写死一级场景）。
  // 一级场景的去重指标不能由二级场景加和(需数仓去重)，业务上看的也是具体场景。
  // 按一级场景分组排序：SCENE1_LIST 顺序分组、组内按名排，为未来多阶段可比做准备。
  var scene2ToS1 = {};
  (data || []).forEach(function(r){
    if(r.aggLevel === 's') return;
    var s2 = r.scene2 || '';
    if(!s2) return;
    if(!scene2ToS1[s2]) scene2ToS1[s2] = r.scene1 || '其他';
  });
  var scenes = (function(){
    var byS1 = {};
    Object.keys(scene2ToS1).forEach(function(s2){
      var s1 = scene2ToS1[s2];
      (byS1[s1] = byS1[s1] || []).push(s2);
    });
    var out = [], seen = {};
    SCENE1_LIST.forEach(function(s1){
      if(byS1[s1]){ byS1[s1].slice().sort().forEach(function(s2){ out.push(s2); }); seen[s1] = true; }
    });
    Object.keys(byS1).sort().forEach(function(s1){
      if(seen[s1]) return;
      byS1[s1].slice().sort().forEach(function(s2){ out.push(s2); });
    });
    return out;
  })();
  var catColors = {'学':'#2563EB', '练':'#10B981', '测':'#F59E0B'};

  // 合计行：场景覆盖全阶段时，等同于阶段总览，使用阶段总览 kp 的使用率/UV
  function kpRateForPhaseOverall(phase){
    if (!phase) return null;
    var kpData = D.kp || {};
    var overallCandidates = ['总览', '场景', '总体', '整体'];
    var pref = phase + '::';
    for (var i = 0; i < overallCandidates.length; i++) {
      if (kpData[pref + overallCandidates[i]]) {
        var kp = kpData[pref + overallCandidates[i]];
        var r = parseFloat(kp.use_rate);
        if (!isNaN(r)) return r <= 1.5 ? r * 100 : r;
        return safeUseRate(kp.use_users, kp.uv);
      }
    }
    if (kpData[phase]) {
      var kp = kpData[phase];
      var r = parseFloat(kp.use_rate);
      if (!isNaN(r)) return r <= 1.5 ? r * 100 : r;
      return safeUseRate(kp.use_users, kp.uv);
    }
    return null;
  }
  function kpUvForPhaseOverall(phase){
    if (!phase) return null;
    var kpData = D.kp || {};
    var overallCandidates = ['总览', '场景', '总体', '整体'];
    var pref = phase + '::';
    for (var i = 0; i < overallCandidates.length; i++) {
      if (kpData[pref + overallCandidates[i]]) {
        var uv = kpData[pref + overallCandidates[i]].uv;
        if (uv === undefined || uv === null || isNaN(uv) || uv === 0) return null;
        return uv;
      }
    }
    if (kpData[phase]) {
      var uv = kpData[phase].uv;
      if (uv === undefined || uv === null || isNaN(uv) || uv === 0) return null;
      return uv;
    }
    return null;
  }

  // 指标配置（已更新为安全版本）
  // ⚠️ 使用率是去重指标：当前看板的 kp 只提供「场景-板块」单维聚合(已按用户ID去重)。
  // 规则：
  //   - 若该二级场景列覆盖当前阶段全部资源，则「板块×场景」等价于「板块整体」，取 kp「场景-板块」真值；
  //   - 若场景列未覆盖全阶段（真正交叉），则去重指标显示"数据不足"；
  //   - 板块"合计"列始终=板块整体单维 kp，是"板块跨场景去重"的真实口径；
  //   - 绝不使用 g.useUsers/g.uv 明细累加(明细无用户ID，累加虚高)。
  var phase = (ACT['phase'] && ACT['phase'][0]) || (data && data.length > 0 ? data[0].phase : '');
  var metricConfig = {
    'use_rate': {label:'使用率', unit:'%', calc:function(g, ctx){
      // 板块整体（合计列）始终走单维 kp；ctx.phase 缺省时回退到矩阵推断的当前阶段 phase
      if (ctx && ctx.isTotal && ctx.cat) {
        var totalPractice=getPracticeKp(ctx.cat, phase);
        if(totalPractice) return safeUseRate(totalPractice.use_users,totalPractice.uv);
      }
      // 右下角总计：若所有场景均覆盖全阶段，则等同于阶段总览
      if (ctx && ctx.isGrandTotal && ctx.phase && ctx.allScenesCover) {
        return kpRateForPhaseOverall(ctx.phase);
      }
      // 场景列：若该场景覆盖当前阶段全部资源，则「板块×场景」等价于「板块整体」，可取 kp；否则数据不足
    // 新增学练测表提供的是板块整体聚合；完整阶段场景列等价于板块整体。
      if (ctx && ctx.cat && ctx.sc && phase && isSceneCoveringWholePhase(phase, 'scene2', ctx.sc)) {
        var practiceKp=getPracticeKp(ctx.cat, phase);
        if(practiceKp) return safeUseRate(practiceKp.use_users,practiceKp.uv);
      }
      return null;
    }, fmt:fmtPct, isPct:true},
    'pv': {label:'PV', unit:'', calc:function(g){ return g.pv; }, fmt:function(v){ return sv(v,0); }, isPct:false},
    // ⚠️ UV 去重：矩阵是"板块×场景"交叉，kp 只有单维"场景-板块"。板块整体或场景覆盖全阶段时等价于板块整体，可取 kp UV；否则数据不足
    'uv': {label:'UV', unit:'', calc:function(g, ctx){
      // 板块整体（合计列）始终走单维 kp；ctx.phase 缺省时回退到矩阵推断的当前阶段 phase
      if (ctx && ctx.isTotal && ctx.cat) {
        var totalPractice=getPracticeKp(ctx.cat, phase);
        if(totalPractice && totalPractice.uv != null) return totalPractice.uv;
      }
      // 右下角总计：若所有场景均覆盖全阶段，则等同于阶段总览
      if (ctx && ctx.isGrandTotal && ctx.phase && ctx.allScenesCover) {
        return kpUvForPhaseOverall(ctx.phase);
      }
      if (ctx && ctx.cat && ctx.sc && phase && isSceneCoveringWholePhase(phase, 'scene2', ctx.sc)) {
        var practiceKp=getPracticeKp(ctx.cat, phase);
        if(practiceKp) return practiceKp.uv == null ? null : practiceKp.uv;
      }
      return null;
    }, fmt:function(v){ return v===null?'<span style="color:var(--t3);font-size:12px" title="UV需按用户ID去重，板块×场景交叉暂无聚合数据">数据不足</span>':sv(v,0); }, isPct:false},
    'download_count': {
      label:'下载次数', unit:'', calc:function(g){ return g.downloadCount; }, fmt:function(v){ return sv(v,0); }, isPct:false
    },
    'download_users': {
      label:'下载用户', unit:'', calc:function(g, ctx){
        // 下载用户属于去重人数；当前没有板块×场景下载用户聚合时不虚构明细合计。
        return null;
      }, fmt:function(v){ return v===null ? '<span style="color:var(--t3);font-size:12px" title="下载用户需按用户ID去重，当前板块×场景暂无聚合数据">数据不足</span>' : sv(v,0); }, isPct:false
    },
    'use_users': {
      label:'使用用户', unit:'', calc:function(g, ctx){
        if(!ctx || !ctx.cat) return null;
        var kp = getPracticeKp(ctx.cat, phase);
        if(ctx.isTotal || (ctx.sc && isSceneCoveringWholePhase(phase, 'scene2', ctx.sc))) return kp ? (kp.use_users == null ? null : kp.use_users) : null;
        return null;
      }, fmt:function(v){ return v===null ? '<span style="color:var(--t3);font-size:12px" title="使用用户需按用户ID去重，当前板块×场景暂无聚合数据">数据不足</span>' : sv(v,0); }, isPct:false
    },
    'paid_users': {
      label:'付费转化用户', unit:'', calc:function(g, ctx){
        if(!ctx || !ctx.cat) return null;
        var kp = getPracticeKp(ctx.cat, phase);
        if(ctx.isTotal || (ctx.sc && isSceneCoveringWholePhase(phase, 'scene2', ctx.sc))) return kp ? (kp.paid_users == null ? null : kp.paid_users) : null;
        return null;
      }, fmt:function(v){ return v===null ? '<span style="color:var(--t3);font-size:12px" title="付费转化用户需按用户ID去重，当前板块×场景暂无聚合数据">数据不足</span>' : sv(v,0); }, isPct:false
    },
    'resource_count': {label:'资源量', unit:'', calc:function(g){ return g.ct; }, fmt:function(v){ return fmt(v); }, isPct:false}
  };

  var currentMetric = CATEGORY_SCENE_METRIC || 'use_rate';
  var cfg = metricConfig[currentMetric];

  // 构建矩阵数据：只累加次数类指标（PV/下载/资源数），去重类指标（UV/使用用户）不参与明细加和。
  var matrix = {};
  categories.forEach(function(cat){
    matrix[cat] = {};
    scenes.forEach(function(sc){ matrix[cat][sc] = {pv:0, downloadCount:0, ct:0}; });
  });

  data.forEach(function(r){
    var cat = getBusinessCategory(r);
    var sc = r.scene2 || '';
    if(!cat || !sc || scenes.indexOf(sc) < 0) return;
    if(r.aggLevel === 's' && r.module !== '学练测') return;
    if(!matrix[cat] || !matrix[cat][sc]) return;
    matrix[cat][sc].pv += r.pv || 0;
    if(!matrix[cat] || !matrix[cat][sc]) return;
    matrix[cat][sc].downloadCount += getDownloadCount(r);
    matrix[cat][sc].ct++;
  });

  var h = '';

  // 无二级场景数据：空态提示（当前筛选条件下没有任何 scene2）
  if(scenes.length === 0){
    return '<div style="padding:14px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;color:#1E40AF;font-size:12px">  当前筛选条件下暂无二级场景数据，无法构建板块 × 场景矩阵。</div>';
  }

  // 指标切换按钮
  h += '<div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">';
  h += '<span style="font-size:13px;font-weight:600;color:var(--t2)">📊 显示指标：</span>';
  var metricBtns = [
    {key:'use_rate', label:'使用率'},
    {key:'pv', label:'PV'},
    {key:'uv', label:'UV'},
    {key:'download_count', label:'下载次数'},
    {key:'download_users', label:'下载用户'},
    {key:'use_users', label:'使用用户'},
    {key:'paid_users', label:'付费转化用户'},
    {key:'resource_count', label:'资源量'}
  ];
  metricBtns.forEach(function(btn){
    var isActive = currentMetric === btn.key;
    var bg = isActive ? 'var(--blue)' : 'var(--s)';
    var color = isActive ? '#fff' : 'var(--t2)';
    var border = isActive ? 'var(--blue)' : 'var(--b)';
    h += '<button onclick="switchCategorySceneMetric(\''+btn.key+'\')" style="padding:4px 12px;border-radius:4px;border:1px solid '+border+';background:'+bg+';color:'+color+';font-size:12px;cursor:pointer;transition:.2s" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1">'+btn.label+'</button>';
  });
  h += '</div>';

  h += '<table class="data-table yoy-table" style="table-layout:fixed">';
  // 表头
  h += '<thead><tr><th style="width:100px">板块 \\ 场景</th>';
  scenes.forEach(function(sc){
    h += '<th style="width:120px;text-align:center">' + esc(sc) + '</th>';
  });
  h += '<th style="width:100px;text-align:center" title="板块整体：跨场景去重聚合的使用率 / 次数类指标为各场景加和">板块整体<br><span style="font-size:10px;font-weight:400">(跨场景去重)</span></th></tr></thead><tbody>';

  // 数据行
  categories.forEach(function(cat){
    h += '<tr>';
    h += '<td class="name" style="font-weight:600"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+catColors[cat]+';margin-right:6px;"></span>' + esc(cat) + '</td>';

    var catTotal = {pv:0, downloadCount:0, ct:0};

    scenes.forEach(function(sc){
      var g = matrix[cat][sc];
      catTotal.pv += g.pv;
      catTotal.downloadCount += g.downloadCount;
      catTotal.ct += g.ct;

      var value = cfg.calc(g, {cat: cat, sc: sc});
      var isZero = g.ct === 0 && currentMetric !== 'resource_count';
      var clickable = isZero ? ' style="cursor:pointer;color:var(--r)" onclick="showReasonPanel({type:\'zero\',metric:\'use_rate\',metricName:\'使用率\',title:\'📊 '+esc(cat)+'×'+esc(sc)+' 数据分析\',value:0})"' : '';

      h += '<td style="text-align:center;padding:10px"' + clickable + '>';
      if(isZero){
        h += '<div style="font-size:11px;color:var(--t3)">无数据</div>';
        h += '<div style="font-size:13px;color:var(--r);font-weight:600">0%</div>';
        h += '<div style="font-size:10px;color:var(--r)">⚠️点击了解</div>';
      } else {
        h += '<div style="font-size:16px;font-weight:700;color:' + catColors[cat] + '">' + cfg.fmt(value) + '</div>';
        var isMissing = value === null || value === undefined || (typeof value === 'number' && isNaN(value));
        h += '<div style="font-size:11px;color:var(--t3);margin-top:4px">' + getMatrixMetricExplanation(currentMetric, 'normal', isMissing) + '</div>';
      }
      h += '</td>';
    });

    // 合计列
    var totalValue = cfg.calc(catTotal, {isTotal: true, cat: cat});
    var totalMissing = totalValue === null || totalValue === undefined || (typeof totalValue === 'number' && isNaN(totalValue));
    h += '<td style="text-align:center;padding:10px;background:var(--s)">';
    h += '<div style="font-size:16px;font-weight:700;color:' + catColors[cat] + '">' + cfg.fmt(totalValue) + '</div>';
    h += '<div style="font-size:11px;color:var(--t3);margin-top:4px">' + getMatrixMetricExplanation(currentMetric, 'total', totalMissing) + '</div>';
    h += '</td>';

    h += '</tr>';
  });

  // 合计行
  h += '<tr style="background:var(--s);font-weight:600">';
  h += '<td style="padding:10px">合计</td>';
  scenes.forEach(function(sc){
    var scTotal = {pv:0, downloadCount:0, ct:0};
    categories.forEach(function(cat){
      var g = matrix[cat][sc];
      scTotal.pv += g.pv;
      scTotal.downloadCount += g.downloadCount;
      scTotal.ct += g.ct;
    });
    var scValue = cfg.calc(scTotal, {sc: sc, phase: phase});
    var scMissing = scValue === null || scValue === undefined || (typeof scValue === 'number' && isNaN(scValue));
    h += '<td style="text-align:center;padding:10px">';
    h += '<div style="font-size:16px;font-weight:700">' + cfg.fmt(scValue) + '</div>';
    h += '<div style="font-size:11px;color:var(--t3);margin-top:4px">' + getMatrixMetricExplanation(currentMetric, 'totalRow', scMissing) + '</div>';
    h += '</td>';
  });
  // 右下角总计
  var grandTotal = {pv:0, downloadCount:0, ct:0};
  categories.forEach(function(cat){
    scenes.forEach(function(sc){
      var g = matrix[cat][sc];
      grandTotal.pv += g.pv;
      grandTotal.downloadCount += g.downloadCount;
      grandTotal.ct += g.ct;
    });
  });
  var allScenesCover = scenes.length > 0 && scenes.every(function(sc){ return phase && isSceneCoveringWholePhase(phase, 'scene2', sc); });
  var grandValue = cfg.calc(grandTotal, {isGrandTotal: true, phase: phase, allScenesCover: allScenesCover});
  var grandMissing = grandValue === null || grandValue === undefined || (typeof grandValue === 'number' && isNaN(grandValue));
  h += '<td style="text-align:center;padding:10px">';
  h += '<div style="font-size:16px;font-weight:700">' + cfg.fmt(grandValue) + '</div>';
  h += '<div style="font-size:11px;color:var(--t3);margin-top:4px">' + getMatrixMetricExplanation(currentMetric, 'grand', grandMissing) + '</div>';
  h += '</td>';
  h += '</tr>';

  h += '</tbody></table>';

  // 图例说明
  h += '<div style="margin-top:8px;font-size:11px;color:var(--t3)">';
  h += '💡 当前显示：<strong>' + cfg.label + '</strong>。点击上方按钮切换指标。红色"⚠️点击了解"表示该板块在此场景下无数据。';
  h += '</div>';

  return h;
}

// 切换板块×场景矩阵表格的显示指标
function switchCategorySceneMetric(metric){
  CATEGORY_SCENE_METRIC = metric;
  // 重新渲染大盘总览页
  applyAndRender();
}

// ===== 通用阶段对比配置 =====
// 基准期 = 左侧阶段筛选选中的阶段
// 对比阶段 = 用户从已有阶段下拉中选择的阶段，支持多选
var TIME_COMPARE_CONFIG = {
  comparePhases: [],           // 对比阶段名称数组（如 '25-26秋季期中'），为空则不对比
  rowDim: 'scene2',           // 纵坐标维度: scene1=一级场景, scene2=二级场景(默认), category=三级场景
  showMetrics: ['pv','uv','download_count','download_users','use_users','paid_users','use_rate','resource_count'],
  showBarChart: false,
  showLineChart: false,
  chartMetrics: [],
  sceneFilter: {},            // rowDim=scene2 时勾选的场景集合 {scene2名:true}；模块级 var 跨 applyAndRender 保留
  sceneFilterInit: false      // 是否已初始化默认勾选（全选）
};

// 核心指标阶段对比图表配置
var CORE_METRICS_CHART_CONFIG = {
  showBarChart: false,
  showLineChart: false,
  selectedMetrics: []
};

// 核心指标对比阶段（独立配置）
var CORE_COMPARE_PHASES = [];

// 指标颜色映射（用于多指标图表）
var METRIC_COLORS = {
  pv: '#2563EB',
  uv: '#10B981',
  useRate: '#F59E0B',
  convertRate: '#EF4444',
  dl: '#8B5CF6',
  ct: '#6366F1'
};

// 获取板块颜色映射（用于表格行标识）
function mapCategoryColor(rv){
  if(['学','练','测'].indexOf(rv) >= 0){
    return {'学':'#2563EB','练':'#10B981','测':'#F59E0B'}[rv];
  }
  if(['轻松学','精准练','模拟卷'].indexOf(rv) >= 0){
    return {'轻松学':'#2563EB','精准练':'#10B981','模拟卷':'#F59E0B'}[rv];
  }
  return null;
}

// 按业务阶段过滤数据（替代日期范围过滤。源数据无逐日记录，只有阶段级别的数据）
function filterByPhase(data, phaseName){
  if(!phaseName) return data;
  return data.filter(function(r){
    return r.phase === phaseName;
  });
}

function getDownloadCount(r){
  if(!r) return 0;
  // downloadCount 是下载次数；只有源字段缺失时才兼容旧数据的 download 别名。
  return Number(r.downloadCount !== undefined ? r.downloadCount : 0) || 0;
}
function getDownloadUsers(r){
  if(!r || r.download === undefined) return null;
  return Number(r.download) || 0;
}
function getSceneCompareDownload(r){
  return getDownloadCount(r);
}

function filterSceneCompareData(data, phase){
  var source = data || ALL_RES;
  return source.filter(function(r){
    if(r.aggLevel === 's') return false;
    if(phase && r.phase !== phase) return false;
    for(var dim in ACT){
      if(dim === 'phase' || dim === 'module') continue;
      var vals = ACT[dim];
      if(Array.isArray(vals) && vals.length && vals.indexOf((r[dim] || '').toString()) < 0) return false;
    }
    if(ACT['module'] && ACT['module'].length && ACT['module'].indexOf((r.module || '').toString()) < 0) return false;
    return true;
  });
}

function getSceneCompareContext(phase){
  var context = {};
  ['stage','course','grade','version','module'].forEach(function(dim){
    if(ACT[dim] && ACT[dim].length) context[dim === 'module' ? 'resourceCategory' : dim] = ACT[dim][0];
  });
  if(phase) context.phase = phase;
  return context;
}

function getSceneCompareKpi(data, phase){
  // The category table's 合计 is the selected phase/scene overall KPI,
  // not the sum of the three 学练测 rows (users must not be added across categories).
  if(TIME_COMPARE_CONFIG.rowDim === 'category' && phase){
    var overall = getPhaseKpiOverall(phase, data);
    return {
      pv: overall.pv || 0,
      uv: overall.dedupMissing ? null : (overall.uv || 0),
      dl: overall.dl || 0,
      downloadUsers: null,
      useUsers: overall.dedupMissing ? null : (overall.useUsers || 0),
      paidUsers: overall.dedupMissing ? null : (overall.paid || 0),
      ct: overall.ct || 0,
      source: overall.source,
      dedupMissing: !!overall.dedupMissing
    };
  }
  var resolved = resolveKpiForContext(data, getSceneCompareContext(phase));
  return {
    pv: resolved.pv || 0,
    uv: resolved.dedupMissing ? null : (resolved.uv || 0),
    dl: resolved.dl || 0,
    downloadUsers: resolved.download_users == null ? null : resolved.download_users,
    useUsers: resolved.dedupMissing ? null : (resolved.use_users || 0),
    paidUsers: resolved.dedupMissing ? null : (resolved.paid_users || 0),
    ct: resolved.resource_count || 0,
    source: resolved.source,
    dedupMissing: !!resolved.dedupMissing
  };
}
function buildTimeCompareTable(data){
  // 基准数据 = 当前左侧筛选数据（现期）
  var baseFiltered = filterSceneCompareData(data, (ACT['phase'] && ACT['phase'][0]) || '');
  var comparePhases = (TIME_COMPARE_CONFIG.comparePhases || []).filter(function(cp){ return !!cp; });
  var hasCompare = comparePhases.length > 0;

  // 获取左侧阶段筛选标签（现期）
  var basePhase = (ACT['phase'] && ACT['phase'][0]) || '';
  // 未选阶段但数据全部同阶段时，推断该阶段（与 KPI 卡片保持一致）
  if (!basePhase && baseFiltered && baseFiltered.length > 0) {
    var firstPh = baseFiltered[0].phase || '';
    var allSamePh = baseFiltered.every(function(r){ return (r.phase || '') === firstPh; });
    if (allSamePh && firstPh) basePhase = firstPh;
  }
  var baseLabel = basePhase || '全部阶段';

  // 总体指标：优先用 kp 总览，保证与 KPI 卡片一致
  var overallBase = getSceneCompareKpi(baseFiltered, basePhase);
  var overallCompare = comparePhases.map(function(cp){
    return getSceneCompareKpi(filterSceneCompareData(ALL_RES, cp), cp);
  });

  // 指标配置：三级场景（板块）复用学练测 KPI 的完整字段口径。
  var metricConfig = {
    'pv': {label:'PV', fmt:function(v){ return sv(v,0); }},
    'uv': {label:'UV', fmt:function(v){ return v===null ? '<span style="color:var(--t3)">数据不足</span>' : sv(v,0); }},
    'download_count': {label:'下载次数', fmt:function(v){ return sv(v,0); }},
    'download_users': {label:'下载用户', fmt:function(v){ return v===null ? '<span style="color:var(--t3)" title="下载用户需独立聚合，当前板块暂无该字段">数据不足</span>' : sv(v,0); }},
    'use_users': {label:'使用用户', fmt:function(v){ return v===null ? '<span style="color:var(--t3)">数据不足</span>' : sv(v,0); }},
    'paid_users': {label:'付费转化用户', fmt:function(v){ return v===null ? '<span style="color:var(--t3)">数据不足</span>' : sv(v,0); }},
    'use_rate': {label:'使用率', fmt:fmtPct},
    'resource_count': {label:'资源量', fmt:function(v){ return fmt(v); }}
  };

  // 根据纵坐标维度获取行数据
  var rowDim = TIME_COMPARE_CONFIG.rowDim || 'scene1';
  var rowLabels = {
    'scene1': '一级场景',
    'scene2': '二级场景',
    'category': '三级场景(板块)'
  };

  // 获取所有行维度值（从基准数据中提取）
  var rowValues = [];
  var allScene2 = [];   // rowDim=scene2 时的全部可选场景（供勾选器，未过滤）
  if(rowDim === 'category'){
    rowValues = ['学', '练', '测'];
  } else if(rowDim === 'scene1'){
    var scene1Set = {};
    baseFiltered.forEach(function(r){ if(r.scene1) scene1Set[r.scene1] = true; });
    rowValues = Object.keys(scene1Set).sort();
  } else if(rowDim === 'scene2'){
    var scene2Set = {};
    baseFiltered.forEach(function(r){ if(r.scene2) scene2Set[r.scene2] = true; });
    allScene2 = Object.keys(scene2Set).sort();
    // 场景勾选过滤：首次默认全选，之后按 sceneFilter 过滤行
    var sf = TIME_COMPARE_CONFIG.sceneFilter || {};
    if(!TIME_COMPARE_CONFIG.sceneFilterInit){
      allScene2.forEach(function(s2){ sf[s2] = true; });
      TIME_COMPARE_CONFIG.sceneFilter = sf;
      TIME_COMPARE_CONFIG.sceneFilterInit = true;
    }
    rowValues = allScene2.filter(function(s2){ return sf[s2]; });
  }

  // 辅助：格式化一行数据
  // ⚠️ 使用率/UV 是去重指标：按场景维度查 kp 聚合(已去重)，无则 null → "数据不足"，不用明细累加。
  // category(板块) 有 kp「场景-板块」聚合；scene1/scene2 暂无聚合 → null。
  // 例外(统一筛选映射)：若该行场景覆盖该阶段全部资源(如二级场景=阶段名)，则视同阶段总览，UV/使用率取 kp 总览。
  function fmtRow(bd, rowVal, rowPhase){
    var rate = null, uv = null, scopeCover = false;
    var kpPhase = rowPhase || basePhase;
    if(rowDim === 'category'){
      rate = kpRateForCategory(rowVal, kpPhase);
      uv = kpUvForCategory(rowVal, kpPhase);
      var categoryKp = getPracticeKp(rowVal, kpPhase);
      var categoryUse = categoryKp ? categoryKp.use_users : null;
      var categoryPaid = categoryKp ? categoryKp.paid_users : null;
      var categoryDownloadUsers = categoryKp ? categoryKp.download_users : null;
      return {pv:categoryKp && categoryKp.pv != null ? categoryKp.pv : bd.pv, uv:uv, download_count:categoryKp && categoryKp.dl != null ? categoryKp.dl : bd.dl, download_users:categoryDownloadUsers != null ? categoryDownloadUsers : null, use_users:categoryUse, paid_users:categoryPaid, use_rate:rate, resource_count:categoryKp && categoryKp.rc != null ? categoryKp.rc : bd.ct, scopeCover:scopeCover};
    } else if((rowDim === 'scene1' || rowDim === 'scene2') && kpPhase && isSceneCoveringWholePhase(kpPhase, rowDim, rowVal)){
      // 覆盖全阶段的场景行：现期填充已统一为 kp 总览口径，uv/使用率直接读 bd（去重真值），无需重查
      if(bd.uv > 0){
        uv = bd.uv;
        rate = safeUseRate(bd.useUsers || 0, bd.uv);
        scopeCover = true;
      }
    }
    // scene1/scene2 无 kp 聚合且未覆盖全阶段时，rate/uv 保持 null
    return {pv:bd.pv, uv:uv, download_count:bd.dl, download_users:null, use_users:scopeCover ? bd.useUsers : null, paid_users:null, use_rate:rate, resource_count:bd.ct, scopeCover:scopeCover};
  }
  function fmtOverall(om){
    // om 来自 getPhaseKpiOverall：kp 命中(source=kp)才有去重值，否则 useUsers/uv=0
    var ok = om && om.source === 'kp' && !om.dedupMissing;
    var rate = ok ? safeUseRate(om.useUsers || 0, om.uv || 0) : null;
    return {pv:om.pv, uv: ok ? (om.uv || 0) : null, download_count:om.dl, download_users:ok ? (om.downloadUsers == null ? null : om.downloadUsers) : null, use_users:ok ? (om.useUsers || 0) : null, paid_users:ok ? (om.paidUsers == null ? null : om.paidUsers) : null, use_rate:ok ? safeUseRate(om.useUsers || 0, om.uv || 0) : null, resource_count:om.ct};
  }
  var matrix = {};
  rowValues.forEach(function(rv){
    matrix[rv] = { base: {pv:0, uv:0, dl:0, ct:0, useUsers:0, paidUsers:null, downloadUsers:null} };
    comparePhases.forEach(function(cp, ci){
      matrix[rv]['c'+ci] = {pv:0, uv:0, dl:0, ct:0, useUsers:0, paidUsers:null, downloadUsers:null};
    });
  });

  // 填充基准数据（现期。只统计 detail 级资源，排除课程汇总避免重复计数）
  baseFiltered.forEach(function(r){
    if(r.aggLevel === 's') return; // skip summary-level records
    var rowValue = getRowValue(r, rowDim);
    if(!rowValue || !matrix[rowValue]) return;
    matrix[rowValue].base.pv += r.pv || 0;
    matrix[rowValue].base.uv += r.uv || 0;
    matrix[rowValue].base.dl += getSceneCompareDownload(r);
    matrix[rowValue].base.ct++;
    matrix[rowValue].base.useUsers += r.total_users || 0;
  });
  // 取数路径统一：某场景行若覆盖该阶段全部资源，则整行(PV/UV/下载/资源量)改用 kp 阶段总览口径，
  // 与"合计"行同源——避免同一批数据在数据行(明细累加)与合计行(kp总览)显示两个数。
  if(basePhase && (rowDim === 'scene1' || rowDim === 'scene2')){
    var _ovB = getSceneCompareKpi(baseFiltered, basePhase);
    if(_ovB && _ovB.source === 'kp' && !_ovB.dedupMissing){
      rowValues.forEach(function(rv){
        if(isSceneCoveringWholePhase(basePhase, rowDim, rv)){
          matrix[rv].base.pv = _ovB.pv || 0;
          matrix[rv].base.uv = _ovB.uv || 0;
          matrix[rv].base.dl = _ovB.dl || 0;
          matrix[rv].base.ct = _ovB.ct || 0;
          matrix[rv].base.useUsers = _ovB.useUsers || 0;
          var basePractice = getPracticeKp(rv, basePhase);
          matrix[rv].base.paidUsers = basePractice ? basePractice.paid_users : null;
        }
      });
    }
  }

  // 填充对比数据（基期 = 选中的历史阶段）
  if(hasCompare){
    comparePhases.forEach(function(cp, ci){
      var cpFiltered = filterSceneCompareData(ALL_RES, cp);
      cpFiltered.forEach(function(r){
        if(r.aggLevel === 's') return; // skip summary-level records
        var rowValue = getRowValue(r, rowDim);
        if(!rowValue || !matrix[rowValue]) return;
        var key = 'c'+ci;
        matrix[rowValue][key].pv += r.pv || 0;
        matrix[rowValue][key].uv += r.uv || 0;
        matrix[rowValue][key].dl += getSceneCompareDownload(r);
        matrix[rowValue][key].ct++;
        matrix[rowValue][key].useUsers += r.total_users || 0;
      });
      // 取数路径统一：基期阶段若某场景覆盖其全部资源，整行改用该基期的 kp 总览口径
      if(rowDim === 'scene1' || rowDim === 'scene2'){
        var _ovC = getSceneCompareKpi(cpFiltered, cp);
        if(_ovC && _ovC.source === 'kp' && !_ovC.dedupMissing){
          var key2 = 'c'+ci;
          rowValues.forEach(function(rv){
            if(isSceneCoveringWholePhase(cp, rowDim, rv)){
              matrix[rv][key2].pv = _ovC.pv || 0;
              matrix[rv][key2].uv = _ovC.uv || 0;
              matrix[rv][key2].dl = _ovC.dl || 0;
              matrix[rv][key2].ct = _ovC.ct || 0;
              matrix[rv][key2].useUsers = _ovC.useUsers || 0;
            }
          });
        }
      }
    });
  }

  function applyCategoryKpToMatrix(phase, matrixKey){
    if(rowDim !== 'category' || !phase) return;
    rowValues.forEach(function(rv){
      var kp = getPracticeKp(rv, phase);
      if(!kp) return;
      var cell = matrix[rv][matrixKey];
      cell.pv = kp.pv || 0;
      cell.uv = kp.uv || 0;
      cell.dl = kp.dl || 0;
      cell.ct = kp.rc || 0;
      cell.useUsers = kp.use_users || 0;
      cell.paidUsers = kp.paid_users == null ? null : kp.paid_users;
    });
  }

  // Category rows must use the same canonical 学练测 KPI for tables and charts.
  applyCategoryKpToMatrix(basePhase, 'base');
  comparePhases.forEach(function(cp, ci){ applyCategoryKpToMatrix(cp, 'c'+ci); });

  var h = '';
  h += '<div style="margin-bottom:16px;padding:12px;background:var(--s);border-radius:8px;border:1px solid var(--b)">';
  h += '<div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px">📅 现期（基准）: <span style="font-weight:400;color:var(--blue)">'+esc(baseLabel)+'</span>（左侧阶段筛选）</div>';

  // 纵坐标维度切换
  h += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
  h += '<span style="font-size:12px;font-weight:600;color:var(--t2)">对比维度:</span>';
  var dimOptions = [
    {key:'scene1', label:'一级场景'},
    {key:'scene2', label:'二级场景'},
    {key:'category', label:'三级场景(板块)'}
  ];
  dimOptions.forEach(function(opt){
    var isActive = TIME_COMPARE_CONFIG.rowDim === opt.key;
    var bg = isActive ? 'var(--blue)' : '#fff';
    var color = isActive ? '#fff' : 'var(--t2)';
    h += '<button onclick="switchTimeCompareRowDim(\'' + opt.key + '\')" style="padding:3px 10px;border-radius:4px;border:1px solid var(--b);background:' + bg + ';color:' + color + ';font-size:12px;cursor:pointer">' + opt.label + '</button>';
  });
  h += '</div>';

  // ===== 场景勾选过滤器（仅二级场景维度显示）=====
  if(rowDim === 'scene2'){
    var sf = TIME_COMPARE_CONFIG.sceneFilter || {};
    var selCount = allScene2.filter(function(s2){ return sf[s2]; }).length;
    h += '<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--b)">';
    h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">';
    h += '<span style="font-size:12px;font-weight:600;color:var(--t2)">  勾选参与对比的场景:</span>';
    h += '<button onclick="tcSceneFilterAll()" style="padding:2px 10px;border-radius:4px;border:1px solid var(--blue);color:var(--blue);background:#fff;font-size:12px;cursor:pointer">全选</button>';
    h += '<button onclick="tcSceneFilterClear()" style="padding:2px 10px;border-radius:4px;border:1px solid var(--b);color:var(--t2);background:#fff;font-size:12px;cursor:pointer">清空</button>';
    h += '<span style="font-size:11px;color:var(--t3)">已选 ' + selCount + ' / ' + allScene2.length + ' 个</span>';
    h += '</div>';
    if(allScene2.length === 0){
      h += '<div style="font-size:12px;color:var(--t3)">当前筛选条件下暂无二级场景数据。</div>';
    } else {
      h += '<div style="display:flex;flex-wrap:wrap;gap:6px 14px">';
      allScene2.forEach(function(s2){
        var checked = sf[s2] ? ' checked' : '';
        var arg = String(s2).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        h += '<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--t2);cursor:pointer;white-space:nowrap">'
           + '<input type="checkbox"' + checked + ' onchange="toggleTcSceneFilter(\'' + arg + '\')" style="cursor:pointer">'
           + esc(s2) + '</label>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>';

  // ===== 对比表格 =====
  // 二级场景维度下勾选 <1 个：空态提示，不渲染空表
  if(rowDim === 'scene2' && rowValues.length === 0){
    h += '<div style="padding:14px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;color:#1E40AF;font-size:12px">  请至少勾选 1 个场景参与对比。</div>';
  } else if(!hasCompare){
    // 无对比：只展示基准数据
    h += '<table class="data-table yoy-table">';
    h += '<thead><tr>';
    h += '<th>'+esc(rowLabels[rowDim])+'</th>';
    TIME_COMPARE_CONFIG.showMetrics.forEach(function(mk){
      h += '<th style="text-align:center">'+metricConfig[mk].label+'</th>';
    });
    h += '</tr></thead><tbody>';
    var om = fmtOverall(overallBase);
    var totalSceneLabel = (ACT['scene2'] && ACT['scene2'].length) ? ACT['scene2'].join('、') : (basePhase || '全部二级场景');
    h += '<tr style="background:#F0FDF4">';
    h += '<td style="font-weight:700;color:#166534">'+esc(totalSceneLabel)+' 合计<div style="font-size:10px;font-weight:400;color:var(--t3)">该二级场景下全部板块（学/练/测）的整体数据</div></td>';
    TIME_COMPARE_CONFIG.showMetrics.forEach(function(mk){
      var v = om[mk];
      h += '<td style="text-align:center;font-weight:700;color:#166534">'+(v===null?'<span style="color:var(--t3)">--</span>':metricConfig[mk].fmt(v))+'</td>';
    });
    h += '</tr>';
    rowValues.forEach(function(rv){
      var bd = matrix[rv].base;
      var bm = fmtRow(bd, rv);
      var rowColor = mapCategoryColor(rv);
      h += '<tr>';
      h += '<td style="font-weight:600">';
      if(rowColor){ h += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+rowColor+';margin-right:6px;"></span>'; }
      h += esc(rv)+(bm.scopeCover?'<div style="font-size:10px;font-weight:400;color:var(--t3)">覆盖全阶段=总览口径</div>':'')+'</td>';
      TIME_COMPARE_CONFIG.showMetrics.forEach(function(mk){
        h += '<td style="text-align:center">'+metricConfig[mk].fmt(bm[mk])+'</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
  } else {
    // 有对比：现期列 + 各基期列 + 变化列
    h += '<div class="tbl-wrap">';
    h += '<table class="data-table yoy-table">';
    h += '<thead><tr>';
    h += '<th rowspan="2" style="text-align:center;vertical-align:middle">'+esc(rowLabels[rowDim])+'</th>';
    h += '<th colspan="'+TIME_COMPARE_CONFIG.showMetrics.length+'" style="text-align:center;background:#DBEAFE;color:var(--blue);font-size:13px">📊 现期<br><span style="font-weight:400;font-size:10px">'+esc(baseLabel)+'</span></th>';
    comparePhases.forEach(function(cp, ci){
      h += '<th colspan="'+(TIME_COMPARE_CONFIG.showMetrics.length+1)+'" style="text-align:center;background:#D1FAE5;color:#059669;font-size:13px">📊 基期<br><span style="font-weight:400;font-size:10px">'+esc(cp)+'</span></th>';
    });
    h += '</tr><tr>';
    TIME_COMPARE_CONFIG.showMetrics.forEach(function(mk){
      h += '<th style="width:90px;text-align:center">'+metricConfig[mk].label+'</th>';
    });
    comparePhases.forEach(function(cp, ci){
      TIME_COMPARE_CONFIG.showMetrics.forEach(function(mk){
        h += '<th style="width:90px;text-align:center;background:var(--s)">'+metricConfig[mk].label+'</th>';
      });
      h += '<th style="width:70px;text-align:center;background:#FEF3C7;color:#D97706">变化</th>';
    });
    h += '</tr></thead><tbody>';

    rowValues.forEach(function(rv){
      var bd = matrix[rv].base;
      var bm = fmtRow(bd, rv);   // 使用率按维度查 kp，无则 null
      var rowColor = mapCategoryColor(rv);
      h += '<tr>';
      h += '<td style="font-weight:600">';
      if(rowColor){ h += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+rowColor+';margin-right:6px;"></span>'; }
      h += esc(rv)+'</td>';

      // 现期列
      TIME_COMPARE_CONFIG.showMetrics.forEach(function(mk){
        var v = bm[mk];
        h += '<td style="text-align:center;padding:8px">'+(v===null?'<span style="color:var(--t3)">--</span>':'<span style="font-weight:600;font-size:13px">'+metricConfig[mk].fmt(v)+'</span>')+'</td>';
      });

      // 各基期列
      comparePhases.forEach(function(cp, ci){
        var cd = matrix[rv]['c'+ci];
        var cm = fmtRow(cd, rv, cp);   // 使用率按维度查 kp，无则 null
        TIME_COMPARE_CONFIG.showMetrics.forEach(function(mk){
          var v = cm[mk];
          h += '<td style="text-align:center;padding:8px;background:var(--s)">'+(v===null?'<span style="color:var(--t3)">--</span>':'<span style="font-weight:600;font-size:13px">'+metricConfig[mk].fmt(v)+'</span>')+'</td>';
        });
        // 变化列（基于使用率）
        var br = bm.use_rate;
        var cr = cm.use_rate;
        var hasMissing = br === null || cr === null;
        var delta = hasMissing ? null : cr - br;
        var deltaColor = hasMissing ? 'var(--t3)' : (delta > 0 ? 'var(--g)' : (delta < 0 ? 'var(--r)' : 'var(--t3)'));
        h += '<td style="text-align:center;padding:8px;font-weight:600;color:'+deltaColor+'">';
        if(hasMissing){ h += '--'; }
        else { h += (delta>=0?'+':'')+delta+'pp'; }
        h += '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  // 图表区域：图表控制条 → 基期选择下拉 → 图表容器
  h += buildTcChartControls();
  h += '<div id="tc-yoy-periods" style="margin-top:12px">';
  h += renderTcPhaseSelect(comparePhases);
  h += '</div>';

  // 只有选择了图表类型和对比指标才渲染图表容器
  h += buildTcChartContainers(rowLabels[rowDim], rowDim);
  window._TC_CHART_DATA = {
    rowValues: rowValues, matrix: matrix, hasCompare: hasCompare,
    baseLabel: baseLabel, basePhase: basePhase, comparePhases: comparePhases,
    rowDim: rowDim
  };

  h += '<div style="margin-top:8px;font-size:11px;color:var(--t3)">';
  h += '💡 左侧阶段筛选 = 现期，此处从已有阶段中选择基期进行对比。';
  h += '</div>';

  return h;
}

// ===== 场景对比-基期选择渲染（下拉替代日期输入） =====
function renderTcPhaseSelect(comparePhases){
  var phases = D.phases || {};
  var currentPhase = (ACT['phase'] && ACT['phase'][0]) || '';
  var h = '';

  comparePhases.forEach(function(cp, i){
    h += '<div class="tc-yoy-period-row" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">';
    h += '<span style="font-size:12px;font-weight:600;color:var(--t2)">📅 基期' + (i+1) + ':</span>';
    h += '<select onchange="updateTcComparePhase(' + i + ', this.value)" style="padding:4px 8px;border:1px solid var(--b);border-radius:4px;font-size:12px">';
    h += '<option value="">-- 选择阶段 --</option>';
    Object.keys(phases).sort().forEach(function(ph){
      if(ph !== currentPhase){
        var sel = cp === ph ? ' selected' : '';
        h += '<option value="' + ph + '"' + sel + '>' + ph + '</option>';
      }
    });
    h += '</select>';
    h += '<button onclick="removeTcComparePhase(' + i + ')" style="padding:3px 8px;border:1px solid var(--r);border-radius:4px;color:var(--r);background:var(--w);cursor:pointer;font-size:12px">✕</button>';
    h += '</div>';
  });
  h += '<div style="display:flex;align-items:center;gap:12px;margin-top:6px">';
  h += '<button onclick="addTcComparePhase()" style="padding:4px 16px;border:1px solid var(--blue);border-radius:6px;color:var(--blue);background:var(--w);cursor:pointer;font-size:12px;font-weight:600">+ 添加基期</button>';
  if(comparePhases.length > 0 && comparePhases.every(function(p){ return p; })){
    h += '<button onclick="applyAndRender()" style="padding:4px 16px;border:1px solid var(--blue);border-radius:6px;background:var(--blue);color:#fff;cursor:pointer;font-size:12px;font-weight:600">✓ 确认对比</button>';
  }
  h += '</div>';
  return h;
}

function addTcComparePhase(){
  TIME_COMPARE_CONFIG.comparePhases.push('');
  applyAndRender();
}
function removeTcComparePhase(idx){
  TIME_COMPARE_CONFIG.comparePhases.splice(idx, 1);
  applyAndRender();
}
function updateTcComparePhase(idx, val){
  TIME_COMPARE_CONFIG.comparePhases[idx] = val;
  applyAndRender();
}

// 通用时间对比图表控制条
function buildTcChartControls(){
  var h = '<div style="margin-top:12px;padding:12px;background:var(--s);border-radius:8px;border:1px solid var(--b)">';

  // 图表类型选择（柱状图 / 折线图 两个独立开关）
  h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">';
  h += '<span style="font-size:12px;font-weight:600;color:var(--t2)">📊 图表类型:</span>';
  var barActive = TIME_COMPARE_CONFIG.showBarChart;
  var lineActive = TIME_COMPARE_CONFIG.showLineChart;
  h += '<button onclick="toggleTcBarChart()" style="padding:4px 12px;border:1px solid var(--b);border-radius:4px;background:'+(barActive?'var(--blue)':'#fff')+';color:'+(barActive?'#fff':'var(--t2)')+';font-size:12px;cursor:pointer;font-weight:500">📊 柱状图</button>';
  h += '<button onclick="toggleTcLineChart()" style="padding:4px 12px;border:1px solid var(--b);border-radius:4px;background:'+(lineActive?'var(--blue)':'#fff')+';color:'+(lineActive?'#fff':'var(--t2)')+';font-size:12px;cursor:pointer;font-weight:500">📈 折线图</button>';
  h += '</div>';

  var metricOptions = [
    {key:'pv', label:'PV'},
    {key:'uv', label:'UV'},
    {key:'use_rate', label:'使用率'},
    {key:'download', label:'下载量'},
    {key:'resource_count', label:'资源量'}
  ];
  h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">';
  h += '<span style="font-size:12px;font-weight:600;color:var(--t2)">📈 对比指标:</span>';
  metricOptions.forEach(function(opt){
    var isSelected = TIME_COMPARE_CONFIG.chartMetrics.indexOf(opt.key) >= 0;
    var bg = isSelected ? 'var(--blue)' : '#fff';
    var color = isSelected ? '#fff' : 'var(--t2)';
    h += '<button onclick="toggleTcChartMetric(\''+opt.key+'\')" style="padding:4px 12px;border:1px solid var(--b);border-radius:4px;background:'+bg+';color:'+color+';font-size:12px;cursor:pointer;font-weight:500">'+esc(opt.label)+'</button>';
  });
  h += '</div>';

  // 空状态提示
  if(!barActive && !lineActive){
    h += '<div style="margin-top:8px;padding:8px 10px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;color:#1E40AF;font-size:12px">📌 请先选择上方的「柱状图」或「折线图」，并至少选择一个对比指标，即可生成对比图表。</div>';
  } else if(TIME_COMPARE_CONFIG.chartMetrics.length === 0){
    h += '<div style="margin-top:8px;padding:8px 10px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;color:#1E40AF;font-size:12px">📌 图表类型已选择，请再选择至少一个「对比指标」以生成图表。</div>';
  }

  h += '</div>';
  return h;
}

// 渲染通用时间对比图表（多段对比、多指标、双Y轴）
// 正确数据结构：x轴=行维度值（场景/板块），每个series=一个时间段，data=各维度值在该时间段的指标值
function renderTimeCompareCharts(){
  var cd = window._TC_CHART_DATA;
  if(!cd) return;

  var showBar = TIME_COMPARE_CONFIG.showBarChart;
  var showLine = TIME_COMPARE_CONFIG.showLineChart;
  if(!showBar && !showLine) return;

  var chartMetrics = TIME_COMPARE_CONFIG.chartMetrics || [];
  if(chartMetrics.length === 0) return;

  var rowValues = cd.rowValues;
  var matrix = cd.matrix;
  var baseLabel = cd.baseLabel;
  var comparePhases = cd.comparePhases || [];
  var rowDim = cd.rowDim;
  var chartIdBase = 'tc-chart-' + rowDim;

  // 时间段列表：现期 + 各基期
  var periodLabels = [baseLabel || '现期'];
  comparePhases.forEach(function(cp){ periodLabels.push(cp || ('基期' + periodLabels.length)); });

  var metricConfig = {
    'pv': {label:'PV', isRate:false},
    'uv': {label:'UV', isRate:false},
    'use_rate': {label:'使用率', isRate:true},
    'download': {label:'下载量', isRate:false},
    'resource_count': {label:'资源量', isRate:false}
  };

  // 指标 key -> matrix 字段映射（matrix 中下载量为 dl，资源量为 ct）
  var metricKeyToMatrix = {
    'pv': 'pv', 'uv': 'uv', 'download': 'dl',
    'use_rate': 'useUsers', 'resource_count': 'ct'
  };

  // 获取某个指标、某个时间段、各维度值的一维数据
  function getPeriodValues(metricKey, periodIdx){
    var phase = periodIdx === 0 ? (cd.basePhase || ((ACT['phase']&&ACT['phase'][0])||'')) : (comparePhases[periodIdx-1] || '');
    return rowValues.map(function(rv){
      var g = periodIdx === 0 ? matrix[rv].base : matrix[rv]['c' + (periodIdx - 1)];
      if(metricKey === 'use_rate'){
        // ⚠️ 使用率是去重指标：category 查 kp「场景-板块」；scene1/scene2 覆盖全阶段时等价于阶段总览，用矩阵已回填的 kp 值
        if(rowDim === 'category') return kpRateForCategory(rv, phase);
        if(phase && (rowDim === 'scene1' || rowDim === 'scene2') && isSceneCoveringWholePhase(phase, rowDim, rv)){
          return safeUseRate(g.useUsers || 0, g.uv || 0);
        }
        return null;   // scene1/scene2 未覆盖全阶段时暂无 kp 聚合
      }
      if(metricKey === 'uv'){
        // ⚠️ UV 去重：category 查 kp「场景-板块」；scene1/scene2 覆盖全阶段时等价于阶段总览，用矩阵已回填的 kp 值
        if(rowDim === 'category') return kpUvForCategory(rv, phase);
        if(phase && (rowDim === 'scene1' || rowDim === 'scene2') && isSceneCoveringWholePhase(phase, rowDim, rv)){
          return g.uv || null;
        }
        return null;
      }
      var k = metricKeyToMatrix[metricKey] || metricKey;
      return g[k];
    });
  }

  var hasRate = chartMetrics.some(function(k){ return metricConfig[k].isRate; });
  var hasAbs = chartMetrics.some(function(k){ return !metricConfig[k].isRate; });
  var absAxisIndex = 0;
  var rateAxisIndex = hasAbs ? 1 : 0;

  function renderChart(containerId, chartType){
    var chart = initChart(containerId);
    if(!chart || rowValues.length === 0) return;

    var series = [];
    chartMetrics.forEach(function(metricKey){
      var cfg = metricConfig[metricKey];
      var baseColor = METRIC_COLORS[metricKey === 'use_rate' ? 'useRate' : (metricKey === 'download' ? 'dl' : (metricKey === 'resource_count' ? 'ct' : metricKey))] || '#2563EB';
      periodLabels.forEach(function(periodLabel, periodIdx){
        // 基准期用原色，对比期依次降低饱和度
        var color = periodIdx === 0 ? baseColor : (baseColor + (periodIdx === 1 ? 'CC' : '99'));
        var values = getPeriodValues(metricKey, periodIdx);
        var s = {
          name: cfg.label + ' · ' + periodLabel,
          data: values,
          yAxisIndex: cfg.isRate ? rateAxisIndex : absAxisIndex,
          type: chartType
        };
        if(chartType === 'bar'){
          s.itemStyle = {color: color, borderRadius:[4,4,0,0]};
          s.barWidth = 12;
        } else {
          s.smooth = true;
          s.symbol = 'circle';
          s.symbolSize = 6;
          s.lineStyle = {color: color, width:2};
          s.itemStyle = {color: color};
        }
        series.push(s);
      });
    });

    var yAxis = [];
    if(hasAbs){
      yAxis.push({type:'value', name:'绝对值', position:'left', axisLabel:{fontSize:11, formatter:function(v){return sv(v,0);}}});
    }
    if(hasRate){
      yAxis.push({type:'value', name:'百分比', position:'right', min:0, max:100, axisLabel:{fontSize:11, formatter:function(v){return v+'%';}}});
    }
    chart.setOption({
      tooltip:{trigger:'axis'},
      legend:{data: series.map(function(s){ return s.name; }), top:0},
      grid:{left:hasRate?70:60, right:hasRate?70:20, top:30, bottom:rowValues.length > 5 ? 60 : 30},
      xAxis:{type:'category', data:rowValues, axisLabel:{fontSize:11, rotate:rowValues.length > 5 ? 30 : 0}},
      yAxis:yAxis,
      series:series
    });
  }

  if(showBar && showLine){
    renderChart(chartIdBase + '-bar', 'bar');
    renderChart(chartIdBase + '-line', 'line');
  } else if(showBar){
    renderChart(chartIdBase + '-main', 'bar');
  } else if(showLine){
    renderChart(chartIdBase + '-main', 'line');
  }
}

// 分维度页时间对比配置
// 左侧阶段筛选 = 现期，此处选择已有阶段作为基期进行对比
var DIM_TIME_COMPARE = {
  comparePhases: [],           // 基期阶段名称数组（如 '25-26秋季期中'）
  showBarChart: false,
  showLineChart: false,
  chartMetrics: []
};

// 构建维度分析页的时间对比内容（基期从已有阶段下拉选择）
function buildDimYoyContent(dim, data){
  var dimLabels = {course:'学科', grade:'年级', version:'版本', module:'资源分类', category:'板块'};
  var dimLabel = dimLabels[dim] || dim;

  // 现期标签 = 左侧阶段筛选
  var basePhase = (ACT['phase'] && ACT['phase'][0]) || '';
  // 未选阶段但数据全部同阶段时，推断该阶段（与 KPI 卡片保持一致）
  if (!basePhase && data && data.length > 0) {
    var firstPh2 = data[0].phase || '';
    var allSamePh2 = data.every(function(r){ return (r.phase || '') === firstPh2; });
    if (allSamePh2 && firstPh2) basePhase = firstPh2;
  }
  var baseLabel = basePhase || '全部阶段';

  var comparePhases = DIM_TIME_COMPARE.comparePhases || [];
  var hasCompare = comparePhases.length > 0;

  // 基准数据 = 当前左侧筛选数据（现期）
  var baseData = data;

  // 指标配置：三级场景（板块）复用学练测 KPI 的完整字段口径。
  var metricConfig = {
    'pv': {label:'PV', fmt:function(v){ return sv(v,0); }},
    'uv': {label:'UV', fmt:function(v){ return v===null ? '<span style="color:var(--t3)">数据不足</span>' : sv(v,0); }},
    'download_count': {label:'下载次数', fmt:function(v){ return sv(v,0); }},
    'download_users': {label:'下载用户', fmt:function(v){ return v===null ? '<span style="color:var(--t3)" title="下载用户需独立聚合，当前板块暂无该字段">数据不足</span>' : sv(v,0); }},
    'use_users': {label:'使用用户', fmt:function(v){ return v===null ? '<span style="color:var(--t3)">数据不足</span>' : sv(v,0); }},
    'paid_users': {label:'付费转化用户', fmt:function(v){ return v===null ? '<span style="color:var(--t3)">数据不足</span>' : sv(v,0); }},
    'use_rate': {label:'使用率', fmt:fmtPct},
    'resource_count': {label:'资源量', fmt:function(v){ return fmt(v); }}
  };
  var showMetrics = ['pv','uv','use_rate','download','resource_count'];

  // 按维度聚合（不过滤，保留全部维度用于表格）
  var baseAgg, compareAggList;
  if(dim === 'category'){
    baseAgg = aggByCategory(baseData).filter(function(item){
      return item.name && item.name !== '未知' && item.name !== 'nan' && item.name !== '';
    });
  } else {
    baseAgg = aggBy(baseData, dim).filter(function(item){
      return item.name && item.name !== '未知' && item.name !== 'nan' && item.name !== '' &&
             item.name !== '阶段复习' && item.name !== '假期综合' && item.name !== '同步学习' && item.name !== '备考冲刺';
    });
  }

  // 汇总各基期数据
  compareAggList = comparePhases.map(function(cp){
    var cpData = filterByPhase(ALL_RES, cp);
    cpData = cpData.filter(function(r){ return r.aggLevel !== 's'; }); // skip summary-level
    var agg;
    if(dim === 'category'){
      agg = aggByCategory(cpData).filter(function(item){
        return item.name && item.name !== '未知' && item.name !== 'nan' && item.name !== '';
      });
    } else {
      agg = aggBy(cpData, dim).filter(function(item){
        return item.name && item.name !== '未知' && item.name !== 'nan' && item.name !== '' &&
               item.name !== '阶段复习' && item.name !== '假期综合' && item.name !== '同步学习' && item.name !== '备考冲刺';
      });
    }
    return {agg: agg, dataCount: cpData.length};
  });

  // 获取所有维度值（合并现期和基期的）
  var allNames = {};
  baseAgg.forEach(function(item){ allNames[item.name] = true; });
  compareAggList.forEach(function(item){ item.agg.forEach(function(a){ allNames[a.name] = true; }); });
  var sortedNames = Object.keys(allNames).sort();

  // 构建对比表格
  var h = '';

  // 筛选控件
  h += '<div style="margin-bottom:16px;padding:12px;background:var(--s);border-radius:8px;border:1px solid var(--b)">';
  h += '<div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px">📅 现期: <span style="font-weight:400;color:var(--blue)">'+esc(baseLabel)+'</span>（左侧阶段筛选）</div>';
  h += '<div style="margin-top:6px;font-size:11px;color:var(--t3)">💡 左侧阶段筛选 = 现期。下方选择已有阶段作为基期进行对比。</div>';
  h += '</div>';

  // 对比表格
  h += '<div class="box">';
  h += '<div class="box-hd"><span class="box-ttl">📈 ' + esc(dimLabel) + '阶段对比</span><span class="box-sub">' + esc(baseLabel) + (hasCompare ? '  vs  多期对比' : '（无基期）') + '</span></div>';

  // 数据缺失提示
  if(hasCompare){
    var baseDataCount = baseData.length;
    var anyCompareEmpty = compareAggList.some(function(item){ return item.dataCount === 0; });
    if(baseDataCount === 0 || anyCompareEmpty){
      h += buildMissingDataAlert(baseLabel, '部分对比期', baseDataCount, anyCompareEmpty ? 0 : 1);
    }
  }

  h += '<div class="tbl-wrap"><table class="data-table yoy-table" style="table-layout:fixed">';
  // 表头
  h += '<thead><tr>';
  h += '<th rowspan="2" style="width:100px;text-align:center;vertical-align:middle">' + esc(dimLabel) + '</th>';
  h += '<th colspan="'+showMetrics.length+'" style="text-align:center;background:#DBEAFE;color:var(--blue);font-size:13px">📊 现期<br><span style="font-weight:400;font-size:10px">'+esc(baseLabel)+'</span></th>';
  comparePhases.forEach(function(cp, i){
    h += '<th colspan="'+showMetrics.length+'" style="text-align:center;background:#D1FAE5;color:#059669;font-size:13px">📊 基期<br><span style="font-weight:400;font-size:10px">'+esc(cp)+'</span></th>';
    h += '<th colspan="2" style="text-align:center;background:#FEF3C7;color:#D97706;font-size:13px">变化('+esc(cp)+')</th>';
  });
  h += '</tr><tr>';
  showMetrics.forEach(function(mk){ h += '<th style="width:70px;text-align:center">' + metricConfig[mk].label + '</th>'; });
  comparePhases.forEach(function(cp, i){
    showMetrics.forEach(function(mk){ h += '<th style="width:70px;text-align:center;background:var(--s)">' + metricConfig[mk].label + '</th>'; });
    h += '<th style="width:60px;text-align:center">净变化</th>';
    h += '<th style="width:60px;text-align:center">变化率</th>';
  });
  h += '</tr></thead><tbody>';

  // 数据行
  sortedNames.forEach(function(name){
    var baseItem = baseAgg.find(function(item){ return item.name === name; }) || {pv:0, uv:0, dl:0, ct:0, useUsers:0};
    // ⚠️ UV 去重：按维度查 kp，无则 null → 显示"--"，不用明细累加
    var baseKpUv = getKpUv(dim, name, basePhase);
    var baseMetrics = {
      pv: baseItem.pv, uv: baseKpUv, download: baseItem.dl,
      // ⚠️ 使用率是去重指标：按维度查 kp 聚合(已去重)，无则 null → "数据不足"，不用明细累加
      use_rate: getKpRate(dim, name, 'use_rate', basePhase),
      resource_count: baseItem.ct
    };

    h += '<tr><td class="name" style="font-weight:600;text-align:center">' + esc(name) + '</td>';

    // 基准指标
    showMetrics.forEach(function(mk){
      var v = baseMetrics[mk];
      var isMissing = v === null;
      var isZero = v === 0 && mk !== 'resource_count';
      h += '<td style="text-align:center;padding:6px">';
      if(isMissing){
        h += '<span style="color:var(--t3);font-size:12px">--</span>';
      } else if(isZero){
        h += '<span style="color:var(--t3);font-size:12px">0</span>';
      } else {
        h += '<span style="font-weight:600;font-size:12px">' + metricConfig[mk].fmt(v) + '</span>';
      }
      h += '</td>';
    });

    // 各基期
    comparePhases.forEach(function(cp, i){
      var compareAgg = compareAggList[i].agg;
      var compareItem = compareAgg.find(function(item){ return item.name === name; }) || {pv:0, uv:0, dl:0, ct:0, useUsers:0};
      // ⚠️ UV 去重：按维度查 kp，无则 null → 显示"--"，不用明细累加
      var compareKpUv = getKpUv(dim, name, cp);
      var compareMetrics = {
        pv: compareItem.pv, uv: compareKpUv, download: compareItem.dl,
        // ⚠️ 使用率是去重指标：按维度查 kp 聚合(已去重)，无则 null → "数据不足"，不用明细累加
        use_rate: getKpRate(dim, name, 'use_rate', cp),
        resource_count: compareItem.ct
      };

      showMetrics.forEach(function(mk){
        var v = compareMetrics[mk];
        var isMissing = v === null;
        var isZero = v === 0 && mk !== 'resource_count';
        h += '<td style="text-align:center;padding:6px;background:var(--s)">';
        if(isMissing){
          h += '<span style="color:var(--t3);font-size:12px">--</span>';
        } else if(isZero){
          h += '<span style="color:var(--t3);font-size:12px">0</span>';
        } else {
          h += '<span style="font-weight:600;font-size:12px">' + metricConfig[mk].fmt(v) + '</span>';
        }
        h += '</td>';
      });

      // 变化（基于使用率）
      var baseRate = baseMetrics.use_rate;
      var compareRate = compareMetrics.use_rate;
      var hasMissingRate = baseRate === null || compareRate === null;
      var delta = hasMissingRate ? null : compareRate - baseRate;
      var deltaPct = hasMissingRate ? null : (baseRate > 0 ? Math.round(delta / baseRate * 100) : (compareRate > 0 ? 100 : 0));
      var deltaColor = hasMissingRate ? 'var(--t3)' : (delta > 0 ? 'var(--g)' : (delta < 0 ? 'var(--r)' : 'var(--t3)'));
      var deltaIcon = hasMissingRate ? '−' : (delta > 0 ? '▲' : (delta < 0 ? '▼' : '−'));

      h += '<td style="text-align:center;padding:6px;font-weight:600;color:' + deltaColor + '">';
      if(hasMissingRate){ h += '--'; } else { h += (delta >= 0 ? '+' : '') + delta + 'pp'; }
      h += '</td>';
      h += '<td style="text-align:center;padding:6px;font-weight:600;color:' + deltaColor + '">';
      if(hasMissingRate){ h += '--'; } else { h += deltaIcon + ' ' + Math.abs(deltaPct) + '%'; }
      h += '</td>';
    });

    h += '</tr>';
  });

  // 合计行
  if(sortedNames.length > 0){
    h += '<tr style="background:var(--s);font-weight:600">';
    h += '<td style="padding:6px;text-align:center">合计</td>';
    var totalBase = {pv:0, uv:0, dl:0, ct:0, useUsers:0};
    baseAgg.forEach(function(b){ totalBase.pv += b.pv; totalBase.uv += b.uv; totalBase.dl += b.dl; totalBase.ct += b.ct; totalBase.useUsers += b.useUsers; });
    // ⚠️ 合计使用率是去重指标：取阶段总览 kp(已去重)，无则 null → "数据不足"，不用明细累加
    var baseOverall = getPhaseKpiOverall(basePhase, baseData);
    var baseOverallOk = baseOverall.source === 'kp' && !baseOverall.dedupMissing;
    var totalBaseMetrics = {
      pv: totalBase.pv, uv: baseOverallOk ? (baseOverall.uv || 0) : null, download: totalBase.dl,
      use_rate: baseOverallOk ? safeUseRate(baseOverall.useUsers, baseOverall.uv) : null,
      resource_count: totalBase.ct
    };
    showMetrics.forEach(function(mk){
      h += '<td style="text-align:center;padding:6px">' + metricConfig[mk].fmt(totalBaseMetrics[mk]) + '</td>';
    });

    comparePhases.forEach(function(cp, i){
      var totalCompare = {pv:0, uv:0, dl:0, ct:0, useUsers:0};
      compareAggList[i].agg.forEach(function(c){ totalCompare.pv += c.pv; totalCompare.uv += c.uv; totalCompare.dl += c.dl; totalCompare.ct += c.ct; totalCompare.useUsers += c.useUsers; });
      // ⚠️ 合计使用率是去重指标：取该阶段总览 kp(已去重)，无则 null → "数据不足"，不用明细累加
      var cpOverall = getPhaseKpiOverall(cp, ALL_RES);
      var cpOverallOk = cpOverall.source === 'kp' && !cpOverall.dedupMissing;
      var totalCompareMetrics = {
        pv: totalCompare.pv, uv: cpOverallOk ? (cpOverall.uv || 0) : null, download: totalCompare.dl,
        use_rate: cpOverallOk ? safeUseRate(cpOverall.useUsers, cpOverall.uv) : null,
        resource_count: totalCompare.ct
      };
      showMetrics.forEach(function(mk){
        h += '<td style="text-align:center;padding:6px;background:var(--s)">' + metricConfig[mk].fmt(totalCompareMetrics[mk]) + '</td>';
      });
      var totalBaseRate = totalBaseMetrics.use_rate;
      var totalCompareRate = totalCompareMetrics.use_rate;
      var hasTotalMissingRate = totalBaseRate === null || totalCompareRate === null;
      var totalDelta = hasTotalMissingRate ? null : totalCompareRate - totalBaseRate;
      var totalDeltaPct = hasTotalMissingRate ? null : (totalBaseRate > 0 ? Math.round(totalDelta / totalBaseRate * 100) : (totalCompareRate > 0 ? 100 : 0));
      var totalDeltaColor = hasTotalMissingRate ? 'var(--t3)' : (totalDelta > 0 ? 'var(--g)' : (totalDelta < 0 ? 'var(--r)' : 'var(--t3)'));
      h += '<td style="text-align:center;padding:6px;color:' + totalDeltaColor + '">';
      if(hasTotalMissingRate){ h += '--'; } else { h += (totalDelta >= 0 ? '+' : '') + totalDelta + 'pp'; }
      h += '</td>';
      h += '<td style="text-align:center;padding:6px;color:' + totalDeltaColor + '">';
      if(hasTotalMissingRate){ h += '--'; } else { h += (totalDelta > 0 ? '▲' : (totalDelta < 0 ? '▼' : '−')) + ' ' + Math.abs(totalDeltaPct) + '%'; }
      h += '</td>';
    });
    h += '</tr>';
  }

  h += '</tbody></table></div></div>';

  // 图表控制条 + 基期选择 + 图表容器
  h += buildDimYoyChartControls(dimLabel);
  h += '<div id="dim-yoy-periods" style="margin-top:12px">';
  h += renderDimYoyPhaseSelect(comparePhases);
  h += '</div>';
  h += buildDimYoyChartContainers(dimLabel);

  // 存储图表数据
  window._DIM_YOY_DATA = {
    baseLabel: baseLabel,
    dim: dim,
    dimLabel: dimLabel,
    comparePhases: comparePhases,
    sortedNames: sortedNames,
    baseAgg: baseAgg,
    compareAggList: compareAggList
  };

  return h;
}

// 渲染维度同比图表（支持多指标、多图表类型、双Y轴、多段对比）
// 正确数据结构：x轴=维度值，每个series=一个（指标·时间段），data=各维度值在该时间段的指标值
function renderDimYoyCharts(dim, data){
  if(!data) data = getFiltered();
  var cd = window._DIM_YOY_DATA;
  if(!cd || cd.dim !== dim){
    // 回退：没有预计算数据时现场计算（兼容旧流程）
    cd = buildDimYoyChartData(dim, data);
  }

  var showBar = DIM_TIME_COMPARE.showBarChart;
  var showLine = DIM_TIME_COMPARE.showLineChart;
  if(!showBar && !showLine) return;

  var chartMetrics = DIM_TIME_COMPARE.chartMetrics || [];
  if(chartMetrics.length === 0) return;

  var names = cd.sortedNames || [];
  var baseAgg = cd.baseAgg || [];
  var compareAggList = cd.compareAggList || [];
  var periodLabels = cd.periodLabels || [cd.baseLabel || '基准期'];
  var baseLabel = cd.baseLabel || '基准期';

  var metricConfig = {
    'pv': {label:'PV', isRate:false},
    'uv': {label:'UV', isRate:false},
    'download': {label:'下载量', isRate:false},
    'use_rate': {label:'使用率', isRate:true},
    'resource_count': {label:'资源量', isRate:false}
  };

  function getPeriodValues(metricKey, periodIdx){
    var agg = periodIdx === 0 ? baseAgg : compareAggList[periodIdx - 1].agg;
    if(!agg) return names.map(function(){ return (metricKey === 'use_rate' || metricKey === 'uv') ? null : 0; });
    // ⚠️ 使用率/UV 是去重指标：按维度查 kp 聚合(已去重)，无则 null → 图表断点，不用明细累加
    var phase = periodIdx === 0 ? (cd.basePhase || ((ACT['phase']&&ACT['phase'][0])||'')) : (periodLabels[periodIdx] || '');
    return names.map(function(name){
      var item = agg.find(function(i){ return i.name === name; }) || {pv:0, uv:0, dl:0, ct:0, useUsers:0};
      if(metricKey === 'use_rate'){
        return getKpRate(dim, name, 'use_rate', phase);
      }
      if(metricKey === 'uv'){
        return getKpUv(dim, name, phase);
      }
      var keyMap = {pv:'pv', uv:'uv', download:'dl', use_rate:'useUsers', resource_count:'ct'};
      return item[keyMap[metricKey]];
    });
  }

  var hasRate = chartMetrics.some(function(k){ return metricConfig[k].isRate; });
  var hasAbs = chartMetrics.some(function(k){ return !metricConfig[k].isRate; });
  var absAxisIndex = 0;
  var rateAxisIndex = hasAbs ? 1 : 0;

  function renderChart(containerId, chartType){
    var chart = initChart(containerId);
    if(!chart || names.length === 0) return;

    var series = [];
    chartMetrics.forEach(function(metricKey){
      var cfg = metricConfig[metricKey];
      var baseColor = METRIC_COLORS[metricKey === 'use_rate' ? 'useRate' : (metricKey === 'download' ? 'dl' : (metricKey === 'resource_count' ? 'ct' : metricKey))] || '#2563EB';
      periodLabels.forEach(function(periodLabel, periodIdx){
        var color = periodIdx === 0 ? baseColor : (baseColor + (periodIdx === 1 ? 'CC' : '99'));
        var values = getPeriodValues(metricKey, periodIdx);
        var s = {
          name: cfg.label + ' · ' + periodLabel,
          data: values,
          yAxisIndex: cfg.isRate ? rateAxisIndex : absAxisIndex,
          type: chartType
        };
        if(chartType === 'bar'){
          s.itemStyle = {color: color, borderRadius:[4,4,0,0]};
          s.barWidth = 12;
        } else {
          s.smooth = true;
          s.symbol = 'circle';
          s.symbolSize = 6;
          s.lineStyle = {color: color, width:2};
          s.itemStyle = {color: color};
        }
        series.push(s);
      });
    });

    var yAxis = [];
    if(hasAbs){
      yAxis.push({type:'value', name:'绝对值', position:'left', axisLabel:{fontSize:11, formatter:function(v){return sv(v,0);}}});
    }
    if(hasRate){
      yAxis.push({type:'value', name:'百分比', position:'right', min:0, max:100, axisLabel:{fontSize:11, formatter:function(v){return v+'%';}}});
    }
    chart.setOption({
      tooltip:{trigger:'axis'},
      legend:{data: series.map(function(s){ return s.name; }), top:0},
      grid:{left:hasRate?70:60, right:hasRate?70:20, top:30, bottom:names.length > 5 ? 60 : 30},
      xAxis:{type:'category', data:names, axisLabel:{fontSize:11, rotate:names.length > 5 ? 30 : 0}},
      yAxis:yAxis,
      series:series
    });
  }

  if(showBar && showLine){
    renderChart('ch-dim-yoy-bar', 'bar');
    renderChart('ch-dim-yoy-line', 'line');
  } else if(showBar){
    renderChart('ch-dim-yoy-main', 'bar');
  } else if(showLine){
    renderChart('ch-dim-yoy-main', 'line');
  }
}

// 渲染分维度时间对比图表数据（供 renderDimYoyCharts 使用）
function buildDimYoyChartData(dim, data){
  var dimLabels = {course:'学科', grade:'年级', version:'版本', module:'资源分类', category:'板块'};
  var basePhase = (ACT['phase'] && ACT['phase'][0]) || '';
  // 未选阶段但数据全部同阶段时，推断该阶段（与 KPI 卡片保持一致）
  if (!basePhase && data && data.length > 0) {
    var fp = data[0].phase || '';
    var asp = data.every(function(r){ return (r.phase || '') === fp; });
    if (asp && fp) basePhase = fp;
  }
  var baseLabel = basePhase || '全部阶段';
  var comparePhases = DIM_TIME_COMPARE.comparePhases || [];
  var baseData = data;

  function aggDim(d, aggDimName){
    if(aggDimName === 'category'){
      return aggByCategory(d).filter(function(item){
        return item.name && item.name !== '未知' && item.name !== 'nan' && item.name !== '';
      }).slice(0, 12);
    }
    return aggBy(d, aggDimName).filter(function(item){
      return item.name && item.name !== '未知' && item.name !== 'nan' && item.name !== '' &&
             item.name !== '阶段复习' && item.name !== '假期综合' && item.name !== '同步学习' && item.name !== '备考冲刺';
    }).slice(0, 12);
  }

  var baseAgg = aggDim(baseData, dim);
  var compareAggList = comparePhases.map(function(cp){
    var cpData = filterByPhase(ALL_RES, cp);
    cpData = cpData.filter(function(r){ return r.aggLevel !== 's'; }); // skip summary-level
    return {agg: aggDim(cpData, dim), dataCount: cpData.length};
  });

  var allNames = {};
  baseAgg.forEach(function(item){ allNames[item.name] = true; });
  compareAggList.forEach(function(item){ item.agg.forEach(function(a){ allNames[a.name] = true; }); });
  var sortedNames = Object.keys(allNames).sort();

  var periodLabels = [baseLabel || '基准期'];
  comparePeriods.forEach(function(cp){
    periodLabels.push(cp.label || ((cp.start||'最早') + '~' + (cp.end||'最晚')));
  });

  return {
    baseLabel: baseLabel,
    basePhase: basePhase,
    dim: dim,
    dimLabel: dimLabels[dim] || dim,
    comparePeriods: comparePeriods,
    sortedNames: sortedNames,
    baseAgg: baseAgg,
    compareAggList: compareAggList,
    periodLabels: periodLabels
  };
}

function buildDimMissingTitle(label, uv, useUsers, paidUsers, metric){
  if(metric === 'uv'){
    return label + '：UV=' + (uv || 0) + '，缺少该维度去重聚合数据，无法计算UV';
  }
  if(metric === 'use_rate'){
    if(uv === 0 || uv === null || uv === undefined){
      return label + '：UV=' + (uv || 0) + '、使用用户=' + (useUsers || 0) + '，无法计算使用率';
    }
    if(useUsers === 0 || useUsers === null || useUsers === undefined){
      return label + '：UV=' + (uv || 0) + '、使用用户=' + (useUsers || 0) + '，无法计算使用率';
    }
    return label + '：UV=' + (uv || 0) + '、使用用户=' + (useUsers || 0) + '，使用率=' + ((useUsers/uv*100).toFixed(2)) + '%';
  }
  if(metric === 'convert_rate'){
    if(uv === 0 || uv === null || uv === undefined){
      return label + '：UV=' + (uv || 0) + '、付费用户=' + (paidUsers || 0) + '，无法计算付费转化率';
    }
    if(paidUsers === 0 || paidUsers === null || paidUsers === undefined){
      return label + '：UV=' + (uv || 0) + '、付费用户=' + (paidUsers || 0) + '，付费转化率为0%';
    }
    return label + '：UV=' + (uv || 0) + '、付费用户=' + (paidUsers || 0) + '，付费转化率=' + ((paidUsers/uv*100).toFixed(2)) + '%';
  }
  return label;
}

// 构建资源分类统一指标：表格与六张图必须共用此口径。
// PV/下载/资源数可由明细聚合；UV/使用人数/付费人数只能来自精确模块KP，禁止明细累加。
function getDimensionScope(kind){
  var stage=(ACT.stage&&ACT.stage[0])||'', course=(ACT.course&&ACT.course[0])||'', grade=(ACT.grade&&ACT.grade[0])||'', version=(ACT.version&&ACT.version[0])||'';
  if(kind==='practice'){
    // 源表支持：总体、学段+年级、学段+学科、学段+学科+年级、学段+学科+版本。
    if(stage&&course&&grade&&version) return null;
    if(grade&&!stage) return null;
    if(version&&!course) return null;
    if(stage&&course&&grade) return [stage,course,grade].join('-');
    if(stage&&course&&version) return [stage,course,version].join('-');
    if(stage&&course) return [stage,course].join('-');
    if(stage&&grade) return [stage,grade].join('-');
    return stage||'';
  }
  // 资源分类支持：总体、学段、学段+年级、学段+学科、学段+学科+年级、学段+学科+年级+版本。
  if(!stage && (course||grade||version)) return null;
  if(stage&&course&&!grade&&!version) return [stage,course].join('-');
  if(stage&&course&&grade) return [stage,course,grade].join('-');
  if(stage&&course) return [stage,course].join('-');
  if(stage&&grade) return [stage,grade].join('-');
  if(stage) return stage;
  return '';
}

}

function buildDimContent(tab, data){

    var activeGrade = (ACT['grade'] && ACT['grade'][0]) || '';
    var activeVersion = (ACT['version'] && ACT['version'][0]) || '';
    var hasExtraSlice = !!(activeGrade || activeVersion);
    // 计算每个学科的使用率和转化率

      // PV/UV/使用率/付费转化 全部走 kp（按 学段学科 精确匹配）
      var kpPv = !hasExtraSlice ? getKpMetric('course', c.name, 'pv', currentPhase) : null;
      var kpUv = !hasExtraSlice ? getKpMetric('course', c.name, 'uv', currentPhase) : null;
      var kpUse = !hasExtraSlice ? getKpMetric('course', c.name, 'use_users', currentPhase) : null;
      var kpPaid = !hasExtraSlice ? getKpMetric('course', c.name, 'paid_users', currentPhase) : null;
      var kpUseRate = !hasExtraSlice ? getKpMetric('course', c.name, 'use_rate', currentPhase) : null;
      var kpConvertRate = !hasExtraSlice ? getKpMetric('course', c.name, 'convert_rate', currentPhase) : null;
      courseMetrics[c.name] = {
        pv: (kpPv !== null) ? kpPv : c.pv,
        uv: (kpUv !== null) ? kpUv : 0,
        uvMissing: (kpUv === null),
        use: 0, dl: 0, ct: c.ct,
        useUsers: kpUse,
        paidUsers: kpPaid,
        useUsersMissing: kpUse === null,
        paidUsersMissing: kpPaid === null,
        label: c.name,
        // 直接展示源数据(kp 权威去重值)，不约分；渲染时由 fmtUseRate 统一2位小数
        useRate: kpUseRate,
        convertRate: kpConvertRate
      };
      courseData.forEach(function(r){ if(r.aggLevel==='s') return; courseMetrics[c.name].dl += r.download||0; });
    });

    var courseScopeTxt = '';
    if(activeGrade) courseScopeTxt += ' · 年级=' + activeGrade;
    if(activeVersion) courseScopeTxt += ' · 版本=' + activeVersion;
    var courseScopeNote = courseScopeTxt ? '（学段+学科；含额外切片时去重指标为"数据不足"' + courseScopeTxt + '）' : '（学段+学科）';

    h += buildDimMetricCharts('course', '📐 学段学科');
    h += '<div class="box"><div class="box-hd"><span class="box-ttl">📋 学段学科明细 TOP15 <span style="font-size:11px;font-weight:400;color:var(--t3)">'+courseScopeNote+'</span></span></div><div class="tbl-wrap"><table class="data-table module-matrix-table"><thead><tr><th style="width:18%">📐 学段学科</th><th style="width:12%">' + dimTh('PV', DIM_TH_NOTE.pv) + '</th><th style="width:12%">' + dimTh('UV', DIM_TH_NOTE.uv) + '</th><th style="width:11%">' + dimTh('使用人数','去重使用用户数') + '</th><th style="width:11%">' + dimTh('付费人数','去重付费用户数') + '</th><th style="width:12%">' + dimTh('使用率', DIM_TH_NOTE.useRate) + '</th><th style="width:14%">' + dimTh('付费转化', DIM_TH_NOTE.convertRate) + '</th><th style="width:10%">' + dimTh('下载', DIM_TH_NOTE.dl) + '</th><th style="width:10%">' + dimTh('资源数', DIM_TH_NOTE.ct) + '</th><th style="width:10%">' + dimTh('评价', DIM_TH_NOTE.eval) + '</th></tr></thead><tbody>';
    cs.forEach(function(c){
      var m = courseMetrics[c.name];
      var evalTag = '';
      if(m.useRate !== null && m.useRate >= 40 && m.convertRate !== null && m.convertRate >= 5) evalTag = '<span class="insight-tag tag-good">优质</span>';
      else if(m.useRate !== null && m.useRate >= 40 && (m.convertRate === null || m.convertRate < 5)) evalTag = '<span class="insight-tag tag-warn">高流低转</span>';
      else if(m.useRate !== null && m.useRate < 20 && m.convertRate !== null && m.convertRate >= 5) evalTag = '<span class="insight-tag tag-info">小众精品</span>';
      else if(m.useRate !== null && m.useRate < 20 && (m.convertRate === null || m.convertRate < 5)) evalTag = '<span class="insight-tag tag-bad">需关注</span>';
      else evalTag = '<span class="insight-tag tag-info">一般</span>';

      var useRateClass = m.useRate !== null && m.useRate >= 40 ? 'rate-high' : (m.useRate !== null && m.useRate >= 20 ? 'rate-mid' : 'rate-low');
      var convertClass = m.convertRate !== null && m.convertRate >= 5 ? 'rate-high' : (m.convertRate !== null && m.convertRate >= 3 ? 'rate-mid' : 'rate-low');

      h += '<tr><td class="name">📐 学段学科 '+esc(c.name)+'</td>';
      h += '<td>'+sv(m.pv,1)+'</td>';
      h += '<td>'+(m.uvMissing ? '<span style="color:var(--t3);font-size:12px" title="'+esc(buildDimMissingTitle(m.label, m.uv, m.useUsers, m.paidUsers, 'uv'))+'">--</span>' : sv(m.uv,1))+'</td>';
      h += '<td>'+((m.useUsers === null || m.useUsersMissing) ? '<span style="color:var(--t3);font-size:12px">--</span>' : sv(m.useUsers,1))+'</td>';
      h += '<td>'+((m.paidUsers === null || m.paidUsersMissing) ? '<span style="color:var(--t3);font-size:12px">--</span>' : sv(m.paidUsers,1))+'</td>';
      h += '<td class="'+useRateClass+'">'+(m.useRate !== null ? fmtUseRate(m.useRate) : '<span style="color:var(--t3);font-size:12px" title="'+esc(buildDimMissingTitle(m.label, m.uv, m.useUsers, m.paidUsers, 'use_rate'))+'">--</span>')+'</td>';
      h += '<td class="'+convertClass+'">'+(m.convertRate !== null ? fmtUseRate(m.convertRate) : '<span style="color:var(--t3);font-size:12px" title="'+esc(buildDimMissingTitle(m.label, m.uv, m.useUsers, m.paidUsers, 'convert_rate'))+'">--</span>')+'</td>';
      h += '<td>'+sv(m.dl)+'</td>';
      h += '<td>'+fmt(m.ct)+'</td>';
      h += '<td>'+evalTag+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
  } else if(tab==='grade'){
    // 年级维度：优先保留聚合级记录（课程年级 sheet 权威数据），detail 级仅作为补充
    var summaryByGrade = {}, detailByGrade = {};
    data.forEach(function(r){
      if(!r.grade || r.grade === '未知' || r.grade === 'nan' || r.grade === '') return;
      if(r.aggLevel === 's'){
        summaryByGrade[r.grade] = {
          pv: r.pv || 0, uv: r.uv || 0, dl: getDownloadCount(r),
          tu: r.total_users || 0, paid: r.paid_users || 0,
          ur: r.use_rate || '', cr: r.convert_rate || '',
          ct: 1, source: 'summary'
        };
      } else {
        if(!detailByGrade[r.grade]) detailByGrade[r.grade] = {pv:0,uv:0,dl:0,ct:0};
        detailByGrade[r.grade].pv += r.pv || 0;
        detailByGrade[r.grade].uv += r.uv || 0;
        detailByGrade[r.grade].dl += getDownloadCount(r);
        detailByGrade[r.grade].ct++;
      }
    });
    // 合并：聚合记录优先，没有聚合记录时用 detail 累加
    var grMap = {};
    Object.keys(summaryByGrade).forEach(function(g){ grMap[g] = summaryByGrade[g]; });

      if(!grMap[g]) grMap[g] = {pv: detailByGrade[g].pv, uv: detailByGrade[g].uv, dl: detailByGrade[g].dl, ct: detailByGrade[g].ct, source: 'detail'};
    });
    var gr = Object.keys(grMap).map(function(g){
      var o = {name:g};
      for(var k in grMap[g]) o[k] = grMap[g][k];
      return o;
    }).sort(function(a,b){ return b.pv - a.pv; });

    var gradeMetrics = {};
    gr.forEach(function(g){
      var activeCourse = (ACT['course'] && ACT['course'][0]) || '';
      var activeVersion = (ACT['version'] && ACT['version'][0]) || '';
      var grCtx = {grade: g.name, course: activeCourse, stage: activeStage, version: activeVersion, phase: currentPhase};
      var gKr = isKpPhase ? resolveKpiForContext([], grCtx) : {source: null};
      var gKpPv = (gKr.source === 'kp') ? gKr.pv : null;
      var gKpUv = (gKr.source === 'kp') ? gKr.uv : null;
      var gKpUse = (gKr.source === 'kp') ? gKr.use_users : null;
      var gKpPaid = (gKr.source === 'kp') ? gKr.paid_users : null;
      // ⚠️ 取数铁律：年级/版本维度的去重指标必须来自 kp 权威聚合。
      // 未选学科时，kp 中的「年级-XX」是各学科×年级累加脏数据，未做跨学科用户去重，禁止使用；

function sortDetailTable(plate, key){
  // 找到对应板块的表格
  var table = document.querySelector('.detail-table[data-plate="'+esc(plate)+'"]');
  if(!table) return;

  var ths = table.querySelectorAll('thead th');
  var tbody = table.querySelector('tbody');
  var rows = Array.from(tbody.querySelectorAll('tr'));

  // 找到当前点击列的索引
  var colIndex = -1;
  var currentKey = null;
  ths.forEach(function(th, idx){
    if(th.getAttribute('data-sort-key') === key){
      colIndex = idx;
    }
    // 记录已存在的排序状态
    if(th.classList.contains('sort-asc') || th.classList.contains('sort-desc')){
      currentKey = th.getAttribute('data-sort-key');
    }
  });
  if(colIndex < 0) return;

  // 确定排序方向：点击同列切换升/降，点击新列默认降序
  var isSame = currentKey === key;
  var thClicked = ths[colIndex];
  var wantDesc = true;
  if(isSame){
    wantDesc = !thClicked.classList.contains('sort-desc');
  }

  // 清除所有表头排序状态
  ths.forEach(function(th){
    th.classList.remove('sort-asc','sort-desc');
  });
  thClicked.classList.add(wantDesc ? 'sort-desc' : 'sort-asc');

  // 按该列 data-sort 数值排序
  rows.sort(function(a,b){
    var aTd = a.cells[colIndex];
    var bTd = b.cells[colIndex];
    var aVal = parseFloat(aTd ? aTd.getAttribute('data-sort') : 0) || 0;
    var bVal = parseFloat(bTd ? bTd.getAttribute('data-sort') : 0) || 0;
    return wantDesc ? (bVal - aVal) : (aVal - bVal);
  });

  // 重新插入（排序后保持原有的 top 200 条限制）
  rows.forEach(function(row){ tbody.appendChild(row); });
}

function filterDetail(){
  var kw = document.getElementById('detail-search').value.toLowerCase();
  // 支持按板块分组后的多个表格（搜索资源ID或资源标题）
  var tables = document.querySelectorAll('.detail-table');
  tables.forEach(function(table){
    var rows = table.querySelectorAll('tbody tr');
    var hasVisible = false;
    rows.forEach(function(row){
      // 资源ID在cells[0]，资源标题在cells[1]
      var rid = row.cells[0] ? row.cells[0].textContent.toLowerCase() : '';
      var title = row.cells[1] ? row.cells[1].textContent.toLowerCase() : '';
      var match = rid.indexOf(kw)>=0 || title.indexOf(kw)>=0;
      row.style.display = match?'':'none';
      if(match) hasVisible = true;
    });
    // 控制明细表格容器及其兄弟提示的显示
    var wrap = table.closest('.detail-wrap');
    if(wrap) wrap.style.display = hasVisible?'':'none';
    // 隐藏"显示前X条"提示（紧跟在 detail-wrap 后面的 div）
    var nextEl = wrap ? wrap.nextElementSibling : null;
    if(nextEl && nextEl.textContent && nextEl.textContent.indexOf('显示前')>=0){
      nextEl.style.display = hasVisible?'':'none';
    }
    // 如果没有匹配的行，隐藏整个板块分组（标题在 wrap 之前的兄弟 div）
    var header = wrap ? wrap.previousElementSibling : null;
    while(header && header.style && !header.style.background){
      header = header.previousElementSibling;
    }
    if(header && header.style) header.style.display = hasVisible?'':'none';
  });
}

function generateAIInsight(containerId, options){
  // 支持无参数调用（概览页兼容）
  containerId = containerId || 'ai-insight-content';
  options = options || {};

  var container = document.getElementById(containerId);
  if(!container) return;
  var data = getFiltered();
  if(data.length === 0){
    container.innerHTML = '<p style="color:var(--t3)">当前筛选条件下无数据，无法生成分析。</p>';
    return;
  }
  container.innerHTML = '<p>⏳ AI正在分析数据，请稍候...</p>';

  var opts = Object.assign({
    type: 'overview',  // overview | dimension | detail
    dimTab: '',
    dimName: ''
  }, options || {});

  var prompt = buildAIPrompt(opts, data);

  callClaudeAPI(prompt, function(result){
    if(result){
      container.innerHTML = result;
    } else {
      container.innerHTML = generateLocalInsight(opts, data);
    }
  });
}

function buildAIPrompt(opts, data){

  if(opts.type === 'overview'){

    var prompt = '你是一位教育数据分析师，请基于以下数据生成简洁有力的分析洞察。';
    prompt += '当前筛选条件：' + (Object.keys(ACT).length > 0 ? Object.keys(ACT).map(function(k){return k + '=' + ACT[k];}).join(', ') : '全部数据') + '。';
    prompt += '\n\n数据摘要：';
    prompt += '\n- 资源总数：' + data.length + '个';
    prompt += '\n- 总PV：' + kpi.pv.toLocaleString() + '，均PV：' + avgPv;
    prompt += '\n- 总UV：' + kpi.uv.toLocaleString();

    prompt += '\n学段分布：' + stageDist.map(function(s){return s.name + '(' + s.pv.toLocaleString() + ')';}).join('、');

    // 加入数据质量信息
    var quality = D.quality || {};
    if(quality.issue_count > 0){
      prompt += '\n\n⚠️ 数据质量警告：检测到 ' + quality.issue_count + ' 个问题';

      });
      prompt += '\n请在分析中特别关注这些数据异常，并给出排查建议。';
    }

    prompt += '\n\n请生成3-4条分析洞察，使用HTML格式，<strong>标记关键结论</strong>，语言简洁专业，总字数控制在300字以内。';

    prompt += '\n- 整体使用率：' + useRate + '%';
    prompt += '\n\n' + dimName + '分布（按PV排序）：';
    dimData.forEach(function(d, i){
      prompt += '\n' + (i+1) + '. ' + d.name + '：PV ' + d.pv.toLocaleString() + '，UV ' + d.uv.toLocaleString() + '，资源数 ' + d.ct;

    prompt += '\n\n请生成3-4条针对' + dimName + '维度的分析洞察，使用HTML格式，语言简洁专业，总字数控制在300字以内。';
    return prompt;
  }

  if(opts.type === 'detail'){
    var topRes = data.slice().sort(function(a,b){return b.pv - a.pv;}).slice(0,20);
    var avgPv = Math.round(kpi.pv / data.length);
    var prompt = '你是一位教育数据分析师，请基于以下资源明细数据生成简洁有力的分析洞察。';

    });

    return prompt;
  }
